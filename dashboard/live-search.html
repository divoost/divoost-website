<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css/dashboard.css">
    <style>
        .search-header { margin-bottom:24px; }
        .search-header h1 { font-size:1.4rem; margin:0 0 16px; }
        .search-box { display:flex; gap:8px; flex-wrap:wrap; }
        .search-box input { flex:1; min-width:200px; background:#FFFFFF; border:1px solid #E2E8F0; color:#0F172A; padding:12px 16px; border-radius:10px; font-size:0.95rem; }
        .search-box input:focus { border-color:#3b82f6; outline:none; }
        .search-box input::placeholder { color:#64748b; }
        .search-box button { padding:12px 24px; border-radius:10px; border:none; cursor:pointer; font-size:0.9rem; font-weight:600; }
        .btn-coupang { background:#e31836; color:#fff; }
        .btn-coupang:hover { background:#c7152f; }
        .btn-1688 { background:#ff6a00; color:#fff; }
        .btn-1688:hover { background:#e55e00; }
        .btn-compare { background:#3b82f6; color:#fff; }
        .btn-compare:hover { background:#2563eb; }

        .results-grid { display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-top:20px; }
        .results-panel { background:#F8FAFC; border-radius:12px; overflow:hidden; }
        .results-panel.full { grid-column:1/-1; }
        .panel-header { padding:14px 20px; font-weight:600; font-size:0.95rem; display:flex; justify-content:space-between; align-items:center; }
        .panel-header.coupang { background:#e31836; }
        .panel-header.alibaba { background:#ff6a00; }
        .panel-header.compare { background:#3b82f6; }
        .panel-header .count { font-weight:400; font-size:0.8rem; opacity:0.8; }
        .panel-body { padding:16px; max-height:600px; overflow-y:auto; }

        .product-card { display:flex; gap:12px; padding:12px; border-radius:8px; border:1px solid #E2E8F0; margin-bottom:8px; transition:border-color 0.2s; }
        .product-card:hover { border-color:#3b82f6; }
        .product-card img { width:80px; height:80px; object-fit:cover; border-radius:6px; background:#FFFFFF; }
        .product-card .info { flex:1; min-width:0; }
        .product-card .name { font-size:0.85rem; font-weight:500; margin-bottom:4px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .product-card .name a { color:#0F172A; text-decoration:none; }
        .product-card .name a:hover { color:#3b82f6; }
        .product-card .price { font-size:1rem; font-weight:700; color:#10b981; }
        .product-card .meta { font-size:0.75rem; color:#64748B; margin-top:4px; display:flex; gap:8px; flex-wrap:wrap; }
        .badge-rocket { background:rgba(227,24,54,0.15); color:#f87171; padding:2px 6px; border-radius:3px; font-size:0.7rem; font-weight:600; }
        .badge-trade { background:rgba(249,115,22,0.15); color:#fb923c; padding:2px 6px; border-radius:3px; font-size:0.7rem; }

        .margin-box { background:#FFFFFF; border-radius:10px; padding:16px 20px; margin-top:12px; }
        .margin-box h3 { font-size:0.85rem; color:#64748B; margin:0 0 8px; }
        .margin-row { display:flex; justify-content:space-between; padding:4px 0; font-size:0.85rem; }
        .margin-row .label { color:#64748B; }
        .margin-row .value { font-weight:600; }
        .margin-positive { color:#10b981; }
        .margin-negative { color:#ef4444; }

        .loading { text-align:center; padding:40px; color:#64748b; }
        .loading .spinner { display:inline-block; width:24px; height:24px; border:3px solid #E2E8F0; border-top-color:#3b82f6; border-radius:50%; animation:spin 0.8s linear infinite; }
        @keyframes spin { to{transform:rotate(360deg)} }
        .error-msg { background:rgba(239,68,68,0.1); border:1px solid rgba(239,68,68,0.3); color:#f87171; padding:12px 16px; border-radius:8px; font-size:0.85rem; }
        .api-status { font-size:0.75rem; padding:4px 10px; border-radius:20px; }
        .api-online { background:rgba(16,185,129,0.15); color:#34d399; }
        .api-offline { background:rgba(239,68,68,0.15); color:#f87171; }

        @media(max-width:768px) { .results-grid { grid-template-columns:1fr; } }
    </style>
</head>

                    <div>
                        <div class="top-bar-title">실시간 소싱 검색</div>
                        <div class="top-bar-date"><span data-i18n="live_api_desc">쿠팡 · 1688 API 실시간 연동 |</span> <span id="apiStatus" class="api-status api-offline" data-i18n="live_api_checking">확인중...</span></div>
                    </div>
                </div>
            </header>

            <div class="content-area" style="padding:20px;">
                <div class="search-header">
                    <h1 data-i18n="live_page_heading">🔍 실시간 소싱 상품 검색</h1>
                    <div class="search-box">
                        <input type="text" id="searchKeyword" data-i18n-ph="live_search_ph" placeholder="검색어 입력 (한국어 또는 중국어)..." onkeydown="if(event.key==='Enter')compareSearch()">
                        <input type="text" id="searchKeyword1688" data-i18n-ph="live_search_ph_1688" placeholder="1688 검색어 (선택, 중국어)" style="max-width:200px;">
                        <button class="btn-coupang" data-i18n="live_btn_coupang" onclick="searchCoupang()">쿠팡 검색</button>
                        <button class="btn-1688" data-i18n="live_btn_1688" onclick="search1688()">1688 검색</button>

    <script>
        var SCRAPER_KEY=''/* 🔴 ScraperAPI 키 노출 사고로 제거됨. 키 회전 후 Edge Function에서 사용 */;
        async function scrapePage(url){var r=await fetch('https://api.scraperapi.com?api_key='+SCRAPER_KEY+'&url='+encodeURIComponent(url)+'&render=false');return r.text()}
        function parseCoupangHTML(html){var products=[];var regex=/<li[^>]*class="[^"]*search-product[^"]*"[^>]*>[\s\S]*?<\/li>/gi;var matches=html.match(regex)||[];for(var i=0;i<Math.min(matches.length,20);i++){var item=matches[i];var nm=item.match(/class="name"[^>]*>([\s\S]*?)<\//);var pr=item.match(/class="price-value"[^>]*>([\s\S]*?)<\//);var rv=item.match(/class="rating-total-count"[^>]*>\(?([\d,]+)\)?<\//);var im=item.match(/src="(https?:\/\/[^"]*thumbnail[^"]*)"/i)||item.match(/data-img-src="([^"]*)"/);var lk=item.match(/href="(\/vp\/products\/\d+[^"]*)"/);if(nm)products.push({name:nm[1].replace(/<[^>]*>/g,'').trim(),price:pr?parseInt(pr[1].replace(/[^\d]/g,''))||0:0,reviewCount:rv?parseInt(rv[1].replace(/[^\d]/g,''))||0:0,image:im?im[1]:'',url:lk?'https://www.coupang.com'+lk[1]:'',platform:'쿠팡'})}return products}
        function parse1688HTML(html){var products=[];var jm=html.match(/var\s+__INIT_DATA\s*=\s*({[\s\S]*?});?\s*<\/script>/);if(jm){try{var d=JSON.parse(jm[1]);var ol=(d.data&&d.data.offerList)||[];for(var i=0;i<Math.min(ol.length,20);i++){var it=ol[i];var ps=(it.tradePrice&&it.tradePrice.offerPrice&&it.tradePrice.offerPrice.valueString)||'0';products.push({name:(it.information&&it.information.subject)||'',price:ps,priceKRW:Math.round(parseFloat(ps)*190.5),image:(it.image&&it.image.imgUrl)||'',url:'https://detail.1688.com/offer/'+(it.id||'')+'.html',platform:'1688'})}}catch(e){}}return products}

        document.addEventListener('DOMContentLoaded', function() {
            var el=document.getElementById('apiStatus');
            if(el){el.textContent=(window.I18N?I18N.t('live_api_online'):'ScraperAPI 프록시 사용');el.className='api-status api-online';el.removeAttribute('data-i18n')}
            var btn=document.getElementById('mobileMenuBtn'),sb=document.getElementById('sidebar'),ov=document.getElementById('sidebarOverlay');
            if(btn)btn.onclick=function(){sb.classList.toggle('open');ov.classList.toggle('active')};
            if(ov)ov.onclick=function(){sb.classList.remove('open');ov.classList.remove('active')};
        });

        function showLoading() {
            var t1=window.I18N?I18N.t('live_searching'):'검색 중...';
            var t2=window.I18N?I18N.t('live_loading_desc'):'ScraperAPI로 데이터를 가져오고 있습니다...';
            document.getElementById('resultsGrid').innerHTML = '<div class="results-panel full"><div class="panel-header compare">'+t1+'</div><div class="panel-body"><div class="loading"><div class="spinner"></div><p style="margin-top:12px">'+t2+'</p></div></div></div>';
        }

        async function searchCoupang() {
            var keyword = document.getElementById('searchKeyword').value.trim();
            if (!keyword) return;
            showLoading();
            try {
                var html = await scrapePage('https://www.coupang.com/np/search?component=&q='+encodeURIComponent(keyword)+'&channel=user');
                var products = parseCoupangHTML(html);
                var grid = document.getElementById('resultsGrid');
                grid.innerHTML = '<div class="results-panel full"><div class="panel-header coupang">'+(window.I18N?I18N.t('live_coupang_results'):'쿠팡 검색 결과')+' <span class="count">'+products.length+(window.I18N?I18N.t('live_count_unit'):'개')+'</span></div><div class="panel-body">'+renderProducts(products,'coupang')+'</div></div>';
            } catch(e) {
                document.getElementById('resultsGrid').innerHTML = '<div class="results-panel full"><div class="panel-header coupang">'+(window.I18N?I18N.t('live_coupang_error'):'쿠팡 검색 오류')+'</div><div class="panel-body"><div class="error-msg">'+e.message+'</div></div></div>';
            }
        }

        async function search1688() {
            var keyword = document.getElementById('searchKeyword1688').value.trim() || document.getElementById('searchKeyword').value.trim();
            if (!keyword) return;
            showLoading();
            const data = await API.alibaba1688Search(keyword);
            const grid = document.getElementById('resultsGrid');
            const t1688Error = window.I18N ? I18N.t('live_1688_error') : '1688 검색 오류';
            const t1688Results = window.I18N ? I18N.t('live_1688_results') : '1688 검색 결과';
            const tCountUnit = window.I18N ? I18N.t('live_count_unit') : '개';
            if (!data.success) {
                grid.innerHTML = `<div class="results-panel full"><div class="panel-header alibaba">${t1688Error}</div><div class="panel-body"><div class="error-msg">${data.error || data.message}</div></div></div>`;
                return;
            }
            grid.innerHTML = `<div class="results-panel full"><div class="panel-header alibaba">${t1688Results} <span class="count">${data.total}${tCountUnit}</span></div><div class="panel-body">${renderProducts(data.products, '1688')}</div></div>`;
        }

        async function compareSearch() {
            const keyword = document.getElementById('searchKeyword').value.trim();
            const keyword1688 = document.getElementById('searchKeyword1688').value.trim();
            if (!keyword) return;
            showLoading();
            try {
                var html1 = await scrapePage('https://s.1688.com/selloffer/offer_search.htm?keywords='+encodeURIComponent(keyword));
                var prods1688 = parse1688HTML(html1);
                var grid = document.getElementById('resultsGrid');
                grid.innerHTML = '<div class="results-panel full"><div class="panel-header alibaba">'+(window.I18N?I18N.t('live_1688_results'):'1688 검색 결과')+' <span class="count">'+prods1688.length+(window.I18N?I18N.t('live_count_unit'):'개')+'</span></div><div class="panel-body">'+renderProducts(prods1688,'1688')+'</div></div>';
            } catch(e) {
                document.getElementById('resultsGrid').innerHTML = '<div class="results-panel full"><div class="panel-header alibaba">'+(window.I18N?I18N.t('live_1688_error'):'1688 검색 오류')+'</div><div class="panel-body"><div class="error-msg">'+e.message+'</div></div></div>';
            }
        }

        async function compareSearch() {
            var keyword = document.getElementById('searchKeyword').value.trim();
            var keyword1688 = document.getElementById('searchKeyword1688').value.trim() || keyword;
            if (!keyword) return;
            showLoading();
            try {
                var cpHtml = await scrapePage('https://www.coupang.com/np/search?component=&q='+encodeURIComponent(keyword)+'&channel=user');
                var cpProducts = parseCoupangHTML(cpHtml);
                var a1Html = await scrapePage('https://s.1688.com/selloffer/offer_search.htm?keywords='+encodeURIComponent(keyword1688));
                var a1Products = parse1688HTML(a1Html);

                var avgCp = cpProducts.length > 0 ? cpProducts.reduce(function(s,p){return s+p.price},0)/cpProducts.length : 0;
                var avgA1 = a1Products.length > 0 ? a1Products.reduce(function(s,p){return s+parseFloat(p.price)},0)/a1Products.length : 0;
                var avgCostKRW = avgA1 * 190.5 + 2000;
                var margin = avgCp > 0 ? ((avgCp - avgCostKRW) / avgCp * 100).toFixed(1) : 0;

                var tCountUnit = window.I18N?I18N.t('live_count_unit'):'개';
                var marginHtml = '<div class="results-panel full"><div class="panel-header compare">'+(window.I18N?I18N.t('live_margin_analysis'):'마진 분석')+'</div><div class="panel-body"><div class="margin-box"><div class="margin-row"><span class="label">'+(window.I18N?I18N.t('live_avg_coupang_price'):'쿠팡 평균 판매가')+'</span><span class="value">₩'+Math.round(avgCp).toLocaleString()+'</span></div><div class="margin-row"><span class="label">'+(window.I18N?I18N.t('live_avg_1688_cost'):'1688 평균 원가+배송')+'</span><span class="value">₩'+Math.round(avgCostKRW).toLocaleString()+'</span></div><div class="margin-row"><span class="label">'+(window.I18N?I18N.t('live_est_margin_rate'):'예상 마진율')+'</span><span class="value '+(margin>0?'margin-positive':'margin-negative')+'">'+margin+'%</span></div></div></div></div>';

                document.getElementById('resultsGrid').innerHTML = marginHtml +
                    '<div class="results-panel"><div class="panel-header coupang">'+(window.I18N?I18N.t('pf_coupang'):'쿠팡')+' <span class="count">'+cpProducts.length+tCountUnit+'</span></div><div class="panel-body">'+renderProducts(cpProducts,'coupang')+'</div></div>' +
                    '<div class="results-panel"><div class="panel-header alibaba">1688 <span class="count">'+a1Products.length+tCountUnit+'</span></div><div class="panel-body">'+renderProducts(a1Products,'1688')+'</div></div>';
            } catch(e) {
                document.getElementById('resultsGrid').innerHTML = '<div class="results-panel full"><div class="panel-header compare">'+(window.I18N?I18N.t('live_compare_error'):'비교 검색 오류')+'</div><div class="panel-body"><div class="error-msg">'+e.message+'</div></div></div>';
            }
        }

        function renderProducts(products, type) {
            const tNoResults = window.I18N ? I18N.t('live_no_results') : '결과 없음';
            if (!products || products.length === 0) return `<div style="text-align:center;color:#64748b;padding:20px;">${tNoResults}</div>`;
            const tRocket = window.I18N ? I18N.t('live_badge_rocket') : '로켓배송';
            const tTradeLabel = window.I18N ? I18N.t('live_trade_label') : '거래';
            const tTradeUnit = window.I18N ? I18N.t('live_trade_unit') : '건';
            const tReviewPrefix = window.I18N ? I18N.t('live_review_prefix') : '리뷰 ';
            return products.map(p => {
                const priceDisplay = type === 'coupang'
                    ? `₩${Number(p.price).toLocaleString()}`
                    : `¥${p.price} <span style="font-size:0.75rem;color:#64748B;">(₩${Math.round(p.price * 190.5).toLocaleString()})</span>`;
                const badges = [];
                if (p.isRocket) badges.push(`<span class="badge-rocket">${tRocket}</span>`);
                if (p.tradeQuantity) badges.push(`<span class="badge-trade">${tTradeLabel} ${p.tradeQuantity}${tTradeUnit}</span>`);
                const imgSrc = p.image || 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80"><rect fill="%231e293b" width="80" height="80"/><text x="40" y="45" text-anchor="middle" fill="%2364748b" font-size="12">No Image</text></svg>';
                return `<div class="product-card"><img src="${imgSrc}" alt="" onerror="this.style.display='none'"><div class="info"><div class="name"><a href="${p.url || '#'}" target="_blank" rel="noopener">${escapeHtml(p.name || '')}</a></div><div class="price">${priceDisplay}</div><div class="meta">${badges.join('')}${p.rating ? ` ⭐${p.rating}` : ''}${p.reviewCount ? ` ${tReviewPrefix}${p.reviewCount}` : ''}</div></div></div>`;
            }).join('');
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }
    </script>
    <script>
        window.I18N_DICT = {
            ko: {
                live_doc_title: '실시간 소싱 검색 | 소싱 트래커',

                live_page_heading: '🔍 실시간 소싱 상품 검색',

                live_btn_coupang: '쿠팡 검색', live_btn_1688: '1688 검색', live_btn_compare: '비교 검색',

            },
            en: {
                live_doc_title: 'Live Sourcing Search | Sourcing Tracker',
                live_api_desc: 'Coupang · 1688 API live sync |', live_api_checking: 'Checking...', live_api_online: 'ScraperAPI proxy active',
                live_page_heading: '🔍 Live Sourcing Product Search',
                live_search_ph: 'Enter a keyword (Korean or Chinese)...', live_search_ph_1688: '1688 keyword (optional, Chinese)',
                live_btn_coupang: 'Search Coupang', live_btn_1688: 'Search 1688', live_btn_compare: 'Compare Search',
                live_searching: 'Searching...', live_loading_desc: 'Fetching data via ScraperAPI...',
                live_coupang_results: 'Coupang Results', live_coupang_error: 'Coupang Search Error',
                live_1688_results: '1688 Results', live_1688_error: '1688 Search Error',
