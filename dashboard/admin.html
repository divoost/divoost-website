<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="admin_doc_title">상품 관리 | 소싱 트래커</title>
    <link rel="stylesheet" href="css/dashboard.css">
    <style>
        .admin-header { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; margin-bottom:20px; }
        .admin-header h1 { font-size:1.4rem; margin:0; }
        .admin-actions { display:flex; gap:8px; flex-wrap:wrap; }

        .filter-bar { background:#F8FAFC; border-radius:12px; padding:16px 20px; margin-bottom:20px; display:flex; gap:12px; flex-wrap:wrap; align-items:flex-end; }
        .filter-group { display:flex; flex-direction:column; gap:4px; }
        .filter-group label { font-size:0.75rem; color:#64748B; font-weight:500; }
        .filter-group input, .filter-group select { background:#FFFFFF; border:1px solid #E2E8F0; color:#0F172A; padding:8px 12px; border-radius:8px; font-size:0.85rem; }
        .filter-group input:focus, .filter-group select:focus { border-color:#3b82f6; outline:none; }

        .btn { padding:8px 16px; border-radius:8px; border:none; cursor:pointer; font-size:0.85rem; font-weight:500; transition:all 0.2s; }
        .btn-primary { background:#3b82f6; color:#fff; }
        .btn-primary:hover { background:#2563eb; }
        .btn-success { background:#10b981; color:#fff; }
        .btn-success:hover { background:#059669; }
        .btn-danger { background:#ef4444; color:#fff; }
        .btn-danger:hover { background:#dc2626; }
        .btn-outline { background:transparent; border:1px solid #475569; color:#64748B; }
        .btn-outline:hover { border-color:#3b82f6; color:#3b82f6; }
        .btn-sm { padding:5px 10px; font-size:0.78rem; }
        .btn-icon { width:32px; height:32px; padding:0; display:inline-flex; align-items:center; justify-content:center; }

        .product-table { width:100%; border-collapse:separate; border-spacing:0; }
        .product-table th { background:#F8FAFC; padding:10px 12px; text-align:left; font-size:0.75rem; color:#64748B; font-weight:600; text-transform:uppercase; position:sticky; top:0; z-index:1; white-space:nowrap; cursor:pointer; user-select:none; }
        .product-table th:hover { color:#0F172A; }
        .product-table th .sort-icon { margin-left:4px; font-size:0.65rem; }
        .product-table td { padding:10px 12px; border-bottom:1px solid #E2E8F0; font-size:0.85rem; white-space:nowrap; }
        .product-table tr:hover td { background:#F8FAFC; }
        .table-wrap { overflow-x:auto; border-radius:12px; background:#FFFFFF; border:1px solid #E2E8F0; max-height:calc(100vh - 360px); overflow-y:auto; }

        .margin-strong { color:#10b981; font-weight:600; }
        .margin-good { color:#3b82f6; font-weight:600; }
        .margin-ok { color:#f59e0b; font-weight:600; }
        .margin-low { color:#ef4444; font-weight:600; }

        .badge-platform { padding:3px 8px; border-radius:4px; font-size:0.72rem; font-weight:600; }
        .badge-1688 { background:rgba(239,68,68,0.15); color:#f87171; }
        .badge-taobao { background:rgba(249,115,22,0.15); color:#fb923c; }
        .badge-coupang { background:rgba(59,130,246,0.15); color:#2563EB; }
        .badge-gmarket { background:rgba(16,185,129,0.15); color:#34d399; }
        .badge-naver { background:rgba(34,197,94,0.15); color:#4ade80; }

        .status-badge { padding:3px 8px; border-radius:4px; font-size:0.72rem; }
        .status-판매중 { background:rgba(16,185,129,0.15); color:#34d399; }
        .status-조사중 { background:rgba(249,115,22,0.15); color:#fb923c; }
        .status-중단 { background:rgba(239,68,68,0.15); color:#f87171; }
        .status-준비중 { background:rgba(59,130,246,0.15); color:#2563EB; }

        .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:1000; align-items:center; justify-content:center; }
        .modal-overlay.active { display:flex; }
        .modal { background:#F8FAFC; border-radius:16px; padding:24px; width:90%; max-width:700px; max-height:90vh; overflow-y:auto; }
        .modal h2 { margin:0 0 20px; font-size:1.2rem; }
        .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
        .form-group { display:flex; flex-direction:column; gap:4px; }
        .form-group.full { grid-column:1/-1; }
        .form-group label { font-size:0.78rem; color:#64748B; font-weight:500; }
        .form-group input, .form-group select, .form-group textarea { background:#FFFFFF; border:1px solid #E2E8F0; color:#0F172A; padding:10px 12px; border-radius:8px; font-size:0.85rem; }
        .form-group textarea { resize:vertical; min-height:60px; }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color:#3b82f6; outline:none; }
        .modal-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:20px; }

        .stats-bar { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:20px; }
        .stat-card { background:#F8FAFC; border-radius:10px; padding:14px 18px; }
        .stat-card .stat-label { font-size:0.72rem; color:#64748B; margin-bottom:4px; }
        .stat-card .stat-value { font-size:1.3rem; font-weight:700; color:#0F172A; }
        .stat-card .stat-sub { font-size:0.72rem; color:#64748b; margin-top:2px; }

        .pagination { display:flex; justify-content:center; gap:4px; margin-top:16px; }
        .pagination button { background:#F8FAFC; border:1px solid #E2E8F0; color:#64748B; padding:6px 12px; border-radius:6px; cursor:pointer; font-size:0.8rem; }
        .pagination button.active { background:#3b82f6; color:#fff; border-color:#3b82f6; }
        .pagination button:hover:not(.active) { border-color:#3b82f6; color:#0F172A; }

        .empty-state { text-align:center; padding:60px 20px; color:#64748b; }
        .empty-state h3 { color:#64748B; margin-bottom:8px; }

        .toast { position:fixed; bottom:24px; right:24px; padding:12px 20px; border-radius:10px; color:#fff; font-size:0.85rem; z-index:2000; animation:slideIn 0.3s ease; }
        .toast-success { background:#10b981; }
        .toast-error { background:#ef4444; }
        @keyframes slideIn { from{transform:translateY(20px);opacity:0} to{transform:translateY(0);opacity:1} }

        @media(max-width:768px) {
            .form-grid { grid-template-columns:1fr; }
            .filter-bar { flex-direction:column; }
            .admin-header { flex-direction:column; align-items:flex-start; }
        }
    </style>
</head>
<body>
    <div class="dashboard-layout">
        <div class="sidebar-overlay" id="sidebarOverlay"></div>
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-logo">
                <div class="sidebar-logo-icon">ST</div>
                <div class="sidebar-logo-text">소싱 트래커<small>MULTI-CHANNEL</small></div>
            </div>
            <nav class="sidebar-nav">
                <div class="sidebar-section">
                    <div class="sidebar-section-title">대시보드</div>
                    <a href="index.html" class="sidebar-link"><span class="sidebar-link-icon">📊</span> 종합 현황</a>
                    <a href="products.html" class="sidebar-link"><span class="sidebar-link-icon">🏆</span> 추천 상품</a>
                    <a href="trends.html" class="sidebar-link"><span class="sidebar-link-icon">📈</span> 트렌드 분석</a>
                    <a href="platforms.html" class="sidebar-link"><span class="sidebar-link-icon">🏪</span> 플랫폼 비교</a>
                    <a href="search-reviews.html" class="sidebar-link"><span class="sidebar-link-icon">🔍</span> 검색 & 리뷰</a>
                    <a href="margin.html" class="sidebar-link"><span class="sidebar-link-icon">💰</span> 마진 분석</a>
                </div>
                <div class="sidebar-section">
                    <div class="sidebar-section-title">관리</div>
                    <a href="ai-sourcing.html" class="sidebar-link"><span class="sidebar-link-icon">🤖</span> AI 소싱</a>
                    <a href="admin.html" class="sidebar-link active"><span class="sidebar-link-icon">⚙️</span> 상품 관리</a>
                    <a href="keyword-analysis.html" class="sidebar-link"><span class="sidebar-link-icon">🔑</span> 키워드 분석</a>
                    <a href="listing.html" class="sidebar-link"><span class="sidebar-link-icon">📤</span> 자동 등록</a>
                    <a href="scraper.html" class="sidebar-link"><span class="sidebar-link-icon">🕷</span> 스크래퍼</a>
                    <a href="db-view.html" class="sidebar-link"><span class="sidebar-link-icon">💾</span> DB 데이터</a>
                    <a href="live-search.html" class="sidebar-link"><span class="sidebar-link-icon">🔴</span> 실시간 검색</a>
                </div>
                <div class="sidebar-section">
                    <div class="sidebar-section-title">바로가기</div>
                    <a href="../index.html" class="sidebar-link"><span class="sidebar-link-icon">🌐</span> 메인 홈</a>
                    
                    
                </div>
            </nav>
        </aside>

        <div class="main-content">
            <header class="top-bar">
                <div class="top-bar-left">
                    <button class="mobile-menu-btn" id="mobileMenuBtn">☰</button>
                    <div>
                        <div class="top-bar-title">상품 관리</div>
                        <div class="top-bar-date" data-i18n="admin_tb_desc">수동 데이터 입력 · 날짜별/월별 필터링</div>
                    </div>
                </div>
            </header>

            <div class="content-area" style="padding:20px;">
                <div class="admin-header">
                    <h1 data-i18n="admin_h1">📦 소싱 상품 관리</h1>
                    <div class="admin-actions">
                        <button class="btn btn-primary" onclick="openModal()" data-i18n="admin_btn_add">+ 상품 추가</button>
                        <button class="btn btn-outline" onclick="DataManager.exportJSON()" data-i18n="admin_btn_export">📥 JSON 내보내기</button>
                        <label class="btn btn-outline" style="cursor:pointer;"><span data-i18n="admin_btn_import">📤 JSON 가져오기</span><input type="file" accept=".json" onchange="importData(this)" hidden></label>
                    </div>
                </div>

                <div class="stats-bar" id="statsBar"></div>

                <div class="filter-bar">
                    <div class="filter-group">
                        <label data-i18n="admin_filter_period">기간</label>
                        <select id="filterPeriod" onchange="applyPeriodPreset()">
                            <option value="all" data-i18n="admin_opt_all">전체</option>
                            <option value="today" data-i18n="admin_opt_today">오늘</option>
                            <option value="7d" data-i18n="admin_opt_7d">최근 7일</option>
                            <option value="30d" data-i18n="admin_opt_30d">최근 30일</option>
                            <option value="month" data-i18n="admin_opt_month">이번 달</option>
                            <option value="custom" data-i18n="admin_opt_custom">직접 선택</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label data-i18n="admin_filter_from">시작일</label>
                        <input type="date" id="filterDateFrom" onchange="applyFilters()">
                    </div>
                    <div class="filter-group">
                        <label data-i18n="admin_filter_to">종료일</label>
                        <input type="date" id="filterDateTo" onchange="applyFilters()">
                    </div>
                    <div class="filter-group">
                        <label data-i18n="admin_filter_source">소싱 플랫폼</label>
                        <select id="filterSource" onchange="applyFilters()">
                            <option value="all" data-i18n="admin_opt_all">전체</option>
                            <option value="1688">1688</option>
                            <option value="타오바오" data-i18n="pf_taobao">타오바오</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label data-i18n="admin_filter_sell">판매 플랫폼</label>
                        <select id="filterSell" onchange="applyFilters()">
                            <option value="all" data-i18n="admin_opt_all">전체</option>
                            <option value="쿠팡" data-i18n="pf_coupang">쿠팡</option>
                            <option value="지마켓" data-i18n="pf_gmarket">지마켓</option>
                            <option value="네이버" data-i18n="pf_naver">네이버</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label data-i18n="admin_filter_category">카테고리</label>
                        <select id="filterCategory" onchange="applyFilters()">
                            <option value="all" data-i18n="admin_opt_all">전체</option>
                            <option value="주방용품" data-i18n="admin_cat_kitchen">주방용품</option>
                            <option value="전자기기" data-i18n="admin_cat_electronics">전자기기</option>
                            <option value="홈인테리어" data-i18n="admin_cat_home">홈인테리어</option>
                            <option value="뷰티도구" data-i18n="admin_cat_beauty">뷰티도구</option>
                            <option value="패션잡화" data-i18n="admin_cat_fashion">패션잡화</option>
                            <option value="반려동물" data-i18n="admin_cat_pet">반려동물</option>
                            <option value="유아/아동" data-i18n="admin_cat_baby">유아/아동</option>
                            <option value="스포츠" data-i18n="admin_cat_sports">스포츠</option>
                            <option value="자동차용품" data-i18n="admin_cat_auto">자동차용품</option>
                            <option value="문구/사무" data-i18n="admin_cat_office">문구/사무</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label data-i18n="admin_filter_search">검색</label>
                        <input type="text" id="filterSearch" placeholder="상품명/키워드..." data-i18n-ph="admin_filter_search_ph" oninput="applyFilters()">
                    </div>
                </div>

                <div class="table-wrap">
                    <table class="product-table">
                        <thead>
                            <tr>
                                <th onclick="sortTable('date')"><span data-i18n="admin_th_date">날짜</span> <span class="sort-icon"></span></th>
                                <th onclick="sortTable('name')"><span data-i18n="th_product">상품명</span> <span class="sort-icon"></span></th>
                                <th onclick="sortTable('category')"><span data-i18n="admin_th_category">카테고리</span> <span class="sort-icon"></span></th>
                                <th onclick="sortTable('sourcePlatform')"><span data-i18n="admin_th_source_short">소싱</span> <span class="sort-icon"></span></th>
                                <th onclick="sortTable('sellPlatform')"><span data-i18n="admin_th_sell_short">판매</span> <span class="sort-icon"></span></th>
                                <th onclick="sortTable('sourcePrice')"><span data-i18n="th_source_price">소싱가</span> <span class="sort-icon"></span></th>
                                <th onclick="sortTable('sellPrice')"><span data-i18n="th_sell_price">판매가</span> <span class="sort-icon"></span></th>
                                <th onclick="sortTable('marginPct')"><span data-i18n="th_margin_rate">마진율</span> <span class="sort-icon"></span></th>
                                <th onclick="sortTable('monthlySales')"><span data-i18n="admin_th_sales">판매량</span> <span class="sort-icon"></span></th>
                                <th onclick="sortTable('status')"><span data-i18n="admin_th_status">상태</span> <span class="sort-icon"></span></th>
                                <th>작업</th>
                            </tr>
                        </thead>
                        <tbody id="productTableBody"></tbody>
                    </table>
                </div>
                <div id="emptyState" class="empty-state" style="display:none;">
                    <h3 data-i18n="admin_empty_title">등록된 상품이 없습니다</h3>
                    <p data-i18n="admin_empty_desc">위의 "상품 추가" 버튼으로 소싱 상품을 등록하세요</p>
                    <button class="btn btn-primary" onclick="loadSamples()" style="margin-top:12px;" data-i18n="admin_btn_samples">샘플 데이터 불러오기</button>
                </div>
                <div class="pagination" id="pagination"></div>
            </div>
        </div>
    </div>

    <!-- Add/Edit Modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <h2 id="modalTitle">상품 추가</h2>
            <form id="productForm" onsubmit="saveProduct(event)">
                <input type="hidden" id="editId">
                <div class="form-grid">
                    <div class="form-group full">
                        <label data-i18n="admin_f_name">상품명 *</label>
                        <input type="text" id="fName" required placeholder="예: 실리콘 주방용품 12종 세트" data-i18n-ph="admin_ph_name">
                    </div>
                    <div class="form-group">
                        <label data-i18n="admin_f_category">카테고리 *</label>
                        <select id="fCategory" required>
                            <option value="" data-i18n="admin_opt_select">선택</option>
                            <option value="주방용품" data-i18n="admin_cat_kitchen">주방용품</option><option value="전자기기" data-i18n="admin_cat_electronics">전자기기</option><option value="홈인테리어" data-i18n="admin_cat_home">홈인테리어</option>
                            <option value="뷰티도구" data-i18n="admin_cat_beauty">뷰티도구</option><option value="패션잡화" data-i18n="admin_cat_fashion">패션잡화</option><option value="반려동물" data-i18n="admin_cat_pet">반려동물</option>
                            <option value="유아/아동" data-i18n="admin_cat_baby">유아/아동</option><option value="스포츠" data-i18n="admin_cat_sports">스포츠</option><option value="자동차용품" data-i18n="admin_cat_auto">자동차용품</option>
                            <option value="문구/사무" data-i18n="admin_cat_office">문구/사무</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label data-i18n="admin_f_regdate">등록일 *</label>
                        <input type="date" id="fDate" required>
                    </div>
                    <div class="form-group">
                        <label data-i18n="admin_f_source">소싱 플랫폼 *</label>
                        <select id="fSourcePlatform" required>
                            <option value="" data-i18n="admin_opt_select">선택</option>
                            <option value="1688">1688</option><option value="타오바오" data-i18n="pf_taobao">타오바오</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label data-i18n="admin_f_sell">판매 플랫폼 *</label>
                        <select id="fSellPlatform" required>
                            <option value="" data-i18n="admin_opt_select">선택</option>
                            <option value="쿠팡" data-i18n="pf_coupang">쿠팡</option><option value="지마켓" data-i18n="pf_gmarket">지마켓</option><option value="네이버" data-i18n="pf_naver">네이버</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label data-i18n="admin_f_sourceprice">소싱가 (CNY) *</label>
                        <input type="number" id="fSourcePrice" step="0.1" required placeholder="예: 12.5" data-i18n-ph="admin_ph_sourceprice">
                    </div>
                    <div class="form-group">
                        <label data-i18n="admin_f_sellprice">판매가 (KRW) *</label>
                        <input type="number" id="fSellPrice" step="100" required placeholder="예: 18900" data-i18n-ph="admin_ph_sellprice">
                    </div>
                    <div class="form-group">
                        <label data-i18n="admin_f_shipping">배송비 (KRW)</label>
                        <input type="number" id="fShipping" step="100" value="0" placeholder="예: 1800" data-i18n-ph="admin_ph_shipping">
                    </div>
                    <div class="form-group">
                        <label data-i18n="admin_f_marginpct">마진율 (%)</label>
                        <input type="number" id="fMargin" step="0.1" placeholder="자동 계산 또는 직접 입력" data-i18n-ph="admin_ph_margin">
                    </div>
                    <div class="form-group">
                        <label data-i18n="admin_f_sales">월 판매량</label>
                        <input type="number" id="fSales" placeholder="예: 3847" data-i18n-ph="admin_ph_sales">
                    </div>
                    <div class="form-group">
                        <label data-i18n="admin_f_rank">판매 순위</label>
                        <input type="number" id="fRank" placeholder="예: 3" data-i18n-ph="admin_ph_rank">
                    </div>
                    <div class="form-group">
                        <label data-i18n="admin_th_status">상태</label>
                        <select id="fStatus">
                            <option value="판매중" data-i18n="admin_status_selling">판매중</option><option value="조사중" data-i18n="admin_status_researching">조사중</option><option value="준비중" data-i18n="admin_status_prep">준비중</option><option value="중단" data-i18n="admin_status_stopped">중단</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label data-i18n="admin_f_direct">직배송 가능</label>
                        <select id="fDirect">
                            <option value="true" data-i18n="admin_opt_yes">가능</option><option value="false" data-i18n="admin_opt_no">불가</option>
                        </select>
                    </div>
                    <div class="form-group">

    <script>
        let currentSort = { by: 'date', dir: 'desc' };
        let currentPage = 1;
        const PAGE_SIZE = 20;

        document.addEventListener('DOMContentLoaded', () => {
            DataManager.loadSampleData();
            document.getElementById('fDate').value = new Date().toISOString().slice(0, 10);
            applyFilters();
            initSidebar();
        });

        function initSidebar() {
            const btn = document.getElementById('mobileMenuBtn');
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            if (btn) btn.onclick = () => { sidebar.classList.toggle('open'); overlay.classList.toggle('active'); };
            if (overlay) overlay.onclick = () => { sidebar.classList.remove('open'); overlay.classList.remove('active'); };
        }

        function getFilterValues() {
            return {
                platform: document.getElementById('filterSource').value !== 'all' ? document.getElementById('filterSource').value : (document.getElementById('filterSell').value !== 'all' ? document.getElementById('filterSell').value : undefined),
                category: document.getElementById('filterCategory').value !== 'all' ? document.getElementById('filterCategory').value : undefined,
                dateFrom: document.getElementById('filterDateFrom').value || undefined,
                dateTo: document.getElementById('filterDateTo').value || undefined,
                search: document.getElementById('filterSearch').value || undefined,
                sortBy: currentSort.by,
                sortDir: currentSort.dir
            };
        }

        function applyPeriodPreset() {
            const v = document.getElementById('filterPeriod').value;
            const today = new Date().toISOString().slice(0, 10);
            const fromEl = document.getElementById('filterDateFrom');
            const toEl = document.getElementById('filterDateTo');
            if (v === 'all') { fromEl.value = ''; toEl.value = ''; }
            else if (v === 'today') { fromEl.value = today; toEl.value = today; }
            else if (v === '7d') { const d = new Date(); d.setDate(d.getDate() - 7); fromEl.value = d.toISOString().slice(0, 10); toEl.value = today; }
            else if (v === '30d') { const d = new Date(); d.setDate(d.getDate() - 30); fromEl.value = d.toISOString().slice(0, 10); toEl.value = today; }
            else if (v === 'month') { fromEl.value = today.slice(0, 7) + '-01'; toEl.value = today; }
            applyFilters();
        }

        function applyFilters() {
            const filters = getFilterValues();
            if (filters.platform) {
                const srcVal = document.getElementById('filterSource').value;
                const sellVal = document.getElementById('filterSell').value;
                let products = DataManager.getAll();
                if (srcVal !== 'all') products = products.filter(p => p.sourcePlatform === srcVal);
                if (sellVal !== 'all') products = products.filter(p => p.sellPlatform === sellVal);
                if (filters.category) products = products.filter(p => p.category === filters.category);
                if (filters.dateFrom) products = products.filter(p => p.date >= filters.dateFrom);
                if (filters.dateTo) products = products.filter(p => p.date <= filters.dateTo);
                if (filters.search) { const q = filters.search.toLowerCase(); products = products.filter(p => p.name.toLowerCase().includes(q) || (p.keywords && p.keywords.toLowerCase().includes(q))); }
                products.sort((a, b) => { let va = a[currentSort.by], vb = b[currentSort.by]; if (typeof va === 'string') va = va.toLowerCase(); if (typeof vb === 'string') vb = vb.toLowerCase(); if (va < vb) return currentSort.dir === 'desc' ? 1 : -1; if (va > vb) return currentSort.dir === 'desc' ? -1 : 1; return 0; });
                renderTable(products);
                renderStats(products);
            } else {
                const products = DataManager.filter(filters);
                renderTable(products);
                renderStats(products);
            }
        }

        function renderStats(products) {
            const total = products.length;
            const avgMargin = total ? (products.reduce((s, p) => s + (p.marginPct || 0), 0) / total).toFixed(1) : 0;
            const totalSales = products.reduce((s, p) => s + (p.monthlySales || 0), 0);
            const selling = products.filter(p => p.status === '판매중').length;
            const highMargin = products.filter(p => (p.marginPct || 0) >= 45).length;

            document.getElementById('statsBar').innerHTML = `
                <div class="stat-card"><div class="stat-label">${I18N.t('admin_stat_total')}</div><div class="stat-value">${total}</div></div>
                <div class="stat-card"><div class="stat-label">${I18N.t('admin_stat_avgmargin')}</div><div class="stat-value">${avgMargin}%</div></div>
                <div class="stat-card"><div class="stat-label">${I18N.t('admin_stat_totalsales')}</div><div class="stat-value">${totalSales.toLocaleString()}</div></div>
                <div class="stat-card"><div class="stat-label">${I18N.t('admin_stat_selling')}</div><div class="stat-value">${selling}</div></div>
                <div class="stat-card"><div class="stat-label">${I18N.t('admin_stat_highmargin')}</div><div class="stat-value">${highMargin}</div></div>
            `;
        }

        function renderTable(products) {
            const tbody = document.getElementById('productTableBody');
            const empty = document.getElementById('emptyState');
            const totalPages = Math.ceil(products.length / PAGE_SIZE);
            if (currentPage > totalPages) currentPage = Math.max(1, totalPages);
            const start = (currentPage - 1) * PAGE_SIZE;
            const pageProducts = products.slice(start, start + PAGE_SIZE);

            if (products.length === 0) {
                tbody.innerHTML = '';
                empty.style.display = 'block';
                document.getElementById('pagination').innerHTML = '';
                return;
            }
            empty.style.display = 'none';

            const platformClass = (p) => { const map = {'1688':'badge-1688','타오바오':'badge-taobao','쿠팡':'badge-coupang','지마켓':'badge-gmarket','네이버':'badge-naver'}; return map[p] || ''; };
            const platformLabel = (p) => { const map = {'타오바오':'pf_taobao','쿠팡':'pf_coupang','지마켓':'pf_gmarket','네이버':'pf_naver'}; return map[p] ? I18N.t(map[p]) : p; };
            const statusLabel = (s) => { const map = {'판매중':'admin_status_selling','조사중':'admin_status_researching','준비중':'admin_status_prep','중단':'admin_status_stopped'}; return map[s] ? I18N.t(map[s]) : s; };
            const marginClass = (m) => m >= 50 ? 'margin-strong' : m >= 40 ? 'margin-good' : m >= 30 ? 'margin-ok' : 'margin-low';

            tbody.innerHTML = pageProducts.map(p => `
                <tr>
                    <td>${p.date || '-'}</td>
                    <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;" title="${p.name}">${p.name}</td>
                    <td>${p.category}</td>
                    <td><span class="badge-platform ${platformClass(p.sourcePlatform)}">${platformLabel(p.sourcePlatform)}</span></td>
                    <td><span class="badge-platform ${platformClass(p.sellPlatform)}">${platformLabel(p.sellPlatform)}</span></td>
                    <td>¥${p.sourcePrice}</td>
                    <td>₩${(p.sellPrice || 0).toLocaleString()}</td>
                    <td><span class="${marginClass(p.marginPct)}">${p.marginPct}%</span></td>
                    <td>${(p.monthlySales || 0).toLocaleString()}</td>
                    <td><span class="status-badge status-${p.status}">${statusLabel(p.status)}</span></td>
                    <td>
                        <button class="btn btn-outline btn-icon btn-sm" onclick="editProduct('${p.id}')" title="${I18N.t('admin_btn_edit')}">✏️</button>
                        <button class="btn btn-danger btn-icon btn-sm" onclick="deleteProduct('${p.id}')" title="${I18N.t('admin_btn_delete')}">🗑</button>
                    </td>
                </tr>
            `).join('');

            let pagHtml = '';
            if (totalPages > 1) {
                if (currentPage > 1) pagHtml += `<button onclick="goPage(${currentPage-1})">◀</button>`;
                for (let i = 1; i <= totalPages; i++) {
                    pagHtml += `<button class="${i===currentPage?'active':''}" onclick="goPage(${i})">${i}</button>`;
                }
                if (currentPage < totalPages) pagHtml += `<button onclick="goPage(${currentPage+1})">▶</button>`;
            }
            document.getElementById('pagination').innerHTML = pagHtml;
        }

        function goPage(p) { currentPage = p; applyFilters(); }

        function sortTable(field) {
            if (currentSort.by === field) currentSort.dir = currentSort.dir === 'asc' ? 'desc' : 'asc';
            else { currentSort.by = field; currentSort.dir = 'desc'; }
            applyFilters();
        }

        function openModal(id) {
            document.getElementById('modalOverlay').classList.add('active');
            document.getElementById('modalTitle').textContent = id ? I18N.t('admin_modal_edit') : I18N.t('admin_modal_add');
            if (id) {
                const p = DataManager.getAll().find(x => x.id === id);
                if (!p) return;
                document.getElementById('editId').value = id;
                document.getElementById('fName').value = p.name;
                document.getElementById('fCategory').value = p.category;
                document.getElementById('fDate').value = p.date;
                document.getElementById('fSourcePlatform').value = p.sourcePlatform;
                document.getElementById('fSellPlatform').value = p.sellPlatform;
                document.getElementById('fSourcePrice').value = p.sourcePrice;
                document.getElementById('fSellPrice').value = p.sellPrice;
                document.getElementById('fShipping').value = p.shippingCost || 0;
                document.getElementById('fMargin').value = p.marginPct;
                document.getElementById('fSales').value = p.monthlySales || '';
                document.getElementById('fRank').value = p.salesRank || '';
                document.getElementById('fStatus').value = p.status || '판매중';
                document.getElementById('fDirect').value = p.directShipping ? 'true' : 'false';
                document.getElementById('fKeywords').value = p.keywords || '';
                document.getElementById('fBadges').value = p.badges || '';
                document.getElementById('fMemo').value = p.memo || '';
            } else {
                document.getElementById('productForm').reset();
                document.getElementById('editId').value = '';
                document.getElementById('fDate').value = new Date().toISOString().slice(0, 10);
            }
        }

        function closeModal() { document.getElementById('modalOverlay').classList.remove('active'); }

        function saveProduct(e) {
            e.preventDefault();
            const data = {
                name: document.getElementById('fName').value,
                category: document.getElementById('fCategory').value,
                date: document.getElementById('fDate').value,
                sourcePlatform: document.getElementById('fSourcePlatform').value,
                sellPlatform: document.getElementById('fSellPlatform').value,
                sourcePrice: parseFloat(document.getElementById('fSourcePrice').value),
                sourceCurrency: 'CNY',
                sellPrice: parseInt(document.getElementById('fSellPrice').value),
                sellCurrency: 'KRW',
                shippingCost: parseInt(document.getElementById('fShipping').value) || 0,
                marginPct: parseFloat(document.getElementById('fMargin').value) || 0,
                monthlySales: parseInt(document.getElementById('fSales').value) || 0,
                salesRank: parseInt(document.getElementById('fRank').value) || 0,
                status: document.getElementById('fStatus').value,
                directShipping: document.getElementById('fDirect').value === 'true',
                keywords: document.getElementById('fKeywords').value,
                badges: document.getElementById('fBadges').value,
                memo: document.getElementById('fMemo').value
            };

            if (!data.marginPct && data.sourcePrice && data.sellPrice) {
                const cost = data.sourcePrice * 190.5 + data.shippingCost;
                data.marginPct = parseFloat(((data.sellPrice - cost) / data.sellPrice * 100).toFixed(1));
            }

            const editId = document.getElementById('editId').value;
            if (editId) { DataManager.update(editId, data); showToast(I18N.t('admin_toast_updated')); }
            else { DataManager.add(data); showToast(I18N.t('admin_toast_added')); }

            closeModal();
            applyFilters();
        }

        function editProduct(id) { openModal(id); }

        function deleteProduct(id) {
            if (!confirm(I18N.t('admin_confirm_delete'))) return;
            DataManager.delete(id);
            showToast(I18N.t('admin_toast_deleted'));
            applyFilters();
        }

        function loadSamples() {
            localStorage.removeItem(DataManager.STORAGE_KEY);
            DataManager.loadSampleData();
            applyFilters();
            showToast(I18N.t('admin_toast_samples_loaded'));
        }

        async function importData(input) {
            if (!input.files[0]) return;
            try {
                const count = await DataManager.importJSON(input.files[0]);
                showToast(I18N.t('admin_toast_imported').replace('{n}', count));
                applyFilters();
            } catch (err) { showToast(err, true); }
            input.value = '';
        }

        function showToast(msg, isError) {
            const t = document.createElement('div');
            t.className = 'toast ' + (isError ? 'toast-error' : 'toast-success');
            t.textContent = msg;
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 3000);
        }
    </script>
