function renderToday(){const contents=scoped(S.contents),posts=S.posts.filter(x=>contents.some(c=>c.id===x.content)),open=scoped(S.inbox).filter(x=>x.status==='open'),approved=contents.filter(x=>x.phase==='approved'||x.phase==='scheduled');const pending=visibleApprovals().filter(x=>x.status==='pending');const schedule=posts.filter(x=>x.status==='scheduled'||x.status==='manual').sort((a,b)=>a.when.localeCompare(b.when)).slice(0,5);return pageHead('오늘의 마케팅 관제','메일함이 아닙니다. 지금 결정할 일, 예정된 게시, AI 작업과 성과를 한눈에 확인합니다.',btn('캠페인 생성','new-campaign','')+btn('새 콘텐츠 만들기','new-content','primary'))+`<div class="roleBanner mb12"><span class="chip demo">샘플 업무 데이터</span><span class="chip">${S.role==='admin'?'관리자 전체 보기':S.role==='staff'?'베트남 담당 업무':'외부 고객 승인 보기'}</span><span class="chip">${S.paused?'⛔ AI 실행 일시 중단':'AI 실행: 승인 기반'}</span></div><div class="grid grid4">${[[pending.length,'승인할 작업','⚑','확인 후 다음 단계 진행','approvals'],[schedule.length,'발행 예정','▦','예약 및 수동 발행 포함','publishing'],[open.length,'응답 대기','💬','문의 유형별 자동 분류 후보','inbox'],[contents.filter(x=>['produce','review','localize'].includes(x.phase)).length,'제작·검수 진행','✦','담당자와 단계별 확인','studio']].map((m)=>`<div class="card metric clickable" data-page="${m[4]}"><div><div class="metric-label">${m[1]}</div><div class="metric-num mono">${m[0]}</div><div class="metric-foot">${m[3]}</div></div><div class="metric-icon">${m[2]}</div></div>`).join('')}</div><div class="mainGrid"><div class="stack"><div class="card card-body"><div class="card-head"><div><h2>🔔 지금 결정해야 할 일</h2><p class="hint">승인·검토·해결해야 할 작업만 표시</p></div><button class="btn sm ghost" data-page="approvals">승인함 전체 →</button></div><div class="stack">${pending.length?pending.slice(0,3).map(x=>`<div class="actionItem clickable" data-action="approval-detail" data-id="${x.id}"><div class="actionBadge">${x.type==='광고'?'📈':x.type==='인플루언서'?'🤝':'🎬'}</div><div class="grow"><h3>${esc(x.title)}</h3><p>${esc(brandName(x.brand))} · ${esc(x.owner)} · ${esc(x.comment)}</p></div>${badge('pending')}</div>`).join(''):'<div class="empty">현재 승인 대기가 없습니다.</div>'}</div></div><div class="card card-body"><div class="card-head"><div><h2>🗓 게시 타임라인</h2><p class="hint">정책 조건에 따라 자동·수동을 분리</p></div><button class="btn sm ghost" data-page="calendar">캘린더 →</button></div>${schedule.length?schedule.map(p=>{let c=byContent(p.content);return `<div class="timelineItem clickable" data-action="post-detail" data-id="${p.id}"><div class="timelineTime mono">${dh(p.when)}</div><span class="timelineLine" style="background:${p.status==='manual'?'#f5b75b':'#8876ff'}"></span><div class="grow"><strong>${esc(c?.title||'삭제된 콘텐츠')}</strong><p>${platform(p.platform)} ${esc(brandName(c?.brand))}</p></div>${badge(p.status)}</div>`}).join(''):'<div class="empty">예정된 게시가 없습니다.</div>'}</div></div><div class="stack"><div class="card card-body"><div class="card-head"><div><h2>🤖 AI 직원 운영</h2><p class="hint">5개 공통 역할 · 승인 없는 외부 실행 금지</p></div><button class="btn sm ghost" data-page="agents">AI 직원 →</button></div><div class="stack" style="gap:7px">${S.agents.map(a=>`<div class="miniWorker"><div class="row grow"><div class="avatar">${a.icon}</div><div class="grow"><div class="workerName">${a.name}</div><div class="workerTask">${esc(a.task)}</div></div></div>${badge(a.state==='실행 중'?'running':a.state==='중단'?'paused':'done',a.state)}</div>`).join('')}</div></div><div class="card card-body"><div class="card-head"><div><h2>📊 콘텐츠 운영 흐름</h2><p class="hint">기획부터 게시까지 한 건의 이력을 추적</p></div><button class="btn sm ghost" data-page="studio">전체 작업 →</button></div>${[['기획','plan'],['제작','produce'],['현지화','localize'],['검토·승인','review'],['게시','scheduled']].map(([n,p],i)=>{const count=contents.filter(c=>i===4?['scheduled','published','approved'].includes(c.phase):c.phase===p).length;return `<div class="funnelRow"><div style="width:100px">${i+1}. ${n}</div><div class="funnelTrack grow"><i style="width:${Math.max(7,Math.min(100,count/Math.max(contents.length,1)*260))}%"></i></div><strong class="mono">${count}건</strong></div function renderCampaigns(){const arr=scoped(S.campaigns);return pageHead('캠페인 관리','브랜드·국가별 목표, 예산, 브리프, KOC, 콘텐츠와 성과를 한 체인으로 관리합니다.',btn('캠페인 추가','new-campaign','primary'))+`<div class="grid grid3">${arr.map(c=>{const count=scoped(S.contents).filter(x=>x.campaign===c.id).length;return `<div class="card card-body"><div class="row between mb12"><span class="pill blue">${esc(c.country)}</span>${badge(c.status,c.status==='running'?'진행 중':'기획 중')}</div><h2>${esc(c.name)}</h2><p class="muted sm mt12">${esc(brandName(c.brand))} · ${esc(c.owner)}</p><p class="muted sm mt12">목표: ${esc(c.goal)}</p><div class="rule"></div><div class="row between sm"><span class="muted">예산 사용</span><b>${fwon(c.spent)} / ${fwon(c.budget)}</b></div><div class="progress mt12"><i style="width:${Math.min(100,c.spent/Math.max(1,c.budget)*100)}%"></i></div><div class="row between mt18"><span class="sm muted">연결 콘텐츠 ${count}개 · ${esc(c.start)}~${esc(c.end)}</span>${btn('관리','campaign-detail','sm',`data-id="${c.id}"`)}</div></div>`}).join('')}</div><div class="card card-body mt18"><h2>캠페인 → 콘텐츠 → 게시 → 광고 → 성과</h2><div class="flowSteps mt12">${[['01','브리프·예산'],['02','콘텐츠·영상'],['03','검수·승인'],['04','채널별 게시'],['05','광고·성과']].map(x=>`<div class="flowStep"><b>${x[0]}</b><small>${x[1]}</small></div>`).join('')}</div><p class="sm muted mt12">연결 기준: tenant_id → brand_id → campaign_id → content_id → asset_id → channel_post_id → ad_creative_id.</p></div>`}
function renderCalendar(){let [y,m]=S.month.split('-').map(Number),first=new Date(y,m-1,1).getDay(),days=new Date(y,m,0).getDate();let arr=scoped(S.contents);let dayMap={};for(let c of arr){let date=(c.date||'').slice(0,10);if(date.startsWith(S.month))(dayMap[Number(date.slice(-2))]??=[]).push(c)}let cells=[];for(let i=0;i<first;i++)cells.push('<div class="daycell dim"></div>');for(let i=1;i<=days;i++){let ds=`${S.month}-${String(i).padStart(2,'0')}`;let cls=ds===dayShift(0)?'today':'';let content=dayMap[i]||[];cells.push(`<div class="daycell ${cls}" data-action="calendar-day" data-id="${ds}"><div class="daynum">${i} <span class="subtle tiny">${content.length?'· '+content.length+'건':''}</span></div>${content.slice(0,3).map(c=>`<div class="calEntry ${c.phase==='published'?'published':c.channels.some(p=>['naver','red'].includes(p))?'manual':'draft'}">${esc(c.title)}</div>`).join('')}${content.length>3?`<div class="tiny muted">+${content.length-3}건</div>`:''}</div>`)}const selected=UI.calDate||dayShift(0);let selectedContents=arr.filter(c=>(c.date||'').startsWith(selected));return pageHead('콘텐츠 캘린더','브랜드·국가·채널별 게시 계획. 자동 예약과 수동 발행 대상을 구분합니다.',btn('월간 계획 제출','month-plan','')+btn('콘텐츠 추가','new-content','primary'))+`<div class="card card-body"><div class="row between wrap mb12"><div class="row"><button class="btn sm" data-action="month-prev">‹</button><h2 style="min-width:120px;text-align:center">${y}년 ${m}월</h2><button class="btn sm" data-action="month-next">›</button><button class="btn sm ghost" data-action="month-today">오늘</button></div><div class="row wrap"><span class="pill blue">예약/예정</span><span class="pill green">게시 완료</span><span class="pill orange">수동 안내</span></div></div><div class="calendar">${['일','월','화','수','목','금','토'].map(x=>`<div class="dayhead">${x}</div>`).join('')}${cells.join('')}</div></div><div class="card card-body mt12"><div class="card-head"><h2>선택 날짜 · ${esc(selected)}</h2><button class="btn sm" data-action="new-content-day" data-id="${selected function renderStudio(){let arr=scoped(S.contents).filter(x=>UI.filter==='all'||x.phase===UI.filter);let filter=`<div class="toolbar"><div class="seg">${[['pipeline','파이프라인'],['table','전체 목록']].map(x=>`<button class="${UI.tab===x[0]?'active':''}" data-action="studio-tab" data-id="${x[0]}">${x[1]}</button>`).join('')}</div><select id="stageFilter" class="filterSmall"><option value="all">전체 단계</option>${['plan','produce','localize','review','approved','scheduled','published'].map(k=>`<option value="${k}" ${UI.filter===k?'selected':''}>${badges[k][0]}</option>`).join('')}</select><div class="grow"></div>${btn('브리프 등록','new-content','primary sm')}</div>`;let body;if(UI.tab==='pipeline'){let stages=[['plan','1. 기획'],['produce','2. 제작'],['localize','3. 현지화'],['review','4. 배포 준비'],['scheduled','5. 게시']];body=`<div class="kanban">${stages.map(([s,t])=>{let a=arr.filter(c=>s==='scheduled'?['scheduled','published'].includes(c.phase):s==='review'?['review','approved'].includes(c.phase):c.phase===s);return `<div class="kanCol"><div class="kanHead">${t}<span class="pill">${a.length}</span></div>${a.map(c=>`<div class="kanCard" data-action="content-detail" data-id="${c.id}"><strong>${esc(c.title)}</strong><p>${esc(brandName(c.brand))} · ${esc(c.owner)}</p><div class="tagline">${c.channels.slice(0,2).map(platform).join('')}</div><p>${dh(c.date)}</p></div>`).join('')}${a.length?'':'<p class="tiny muted">항목 없음</p>'}</div>`}).join('')}</div>`}else body=`<div class="tableWrap"><table class="contentTable"><thead><tr><th style="width:30%">콘텐츠</th><th>브랜드</th><th>채널</th><th>단계</th><th>담당</th><th>예정</th><th></th></tr></thead><tbody>${arr.map(c=>`<tr><td><b>${esc(c.title)}</b></td><td>${esc(brandName(c.brand))}</td><td>${c.channels.map(platform).join('')}</td><td>${badge(c.phase)}</td><td>${esc(c.owner)}</td><td>${dh(c.date)}</td><td>${btn('열기','content-detail','sm',`data-id="${c.id}"`)}</td></tr>`).join('')}</tbody></table></div>`;return pageHead('콘텐츠 스튜디오','EZworks에서 이관할 5단계 SNS 파이프라인입니다 function postModal(){const eligible=scoped(S.contents).filter(c=>['approved','scheduled','published'].includes(c.phase));const body=eligible.length?`<form id="mainForm" data-form="post"><div class="formGrid">${labelField('승인된 콘텐츠',`<select name="content">${eligible.map(c=>`<option value="${c.id}">${esc(c.title)}</option>`).join('')}</select>`)}${labelField('대상 채널',`<select name="platform">${formOpts(Object.keys(names).map(x=>[x,names[x]]),'insta')}</select>`)}${labelField('예약 일시',`<input name="when" type="datetime-local" value="${dayTime(1,'10:00')}">`)}${labelField('게시 방식',`<select name="method"><option value="auto">공식 연동 가능 시 자동</option><option value="manual">직원이 수동 게시</option></select>`)}</div><div class="notice warn mt12">실제 앱 연동·권한이 확인되지 않았으므로 이 화면은 시연 큐만 만듭니다. 수동 채널은 자동 게시로 저장되지 않습니다.</div></form>`:'<div class="empty">예약할 수 있는 승인된 콘텐츠가 없습니다. 먼저 콘텐츠를 만들고 승인해 주세요.</div>';openModal('예약 게시 생성',body,eligible.length?`<button class="btn" data-action="close-modal">취소</button><button class="btn primary" data-action="submit-form">예약 저장(데모)</button>`:btn('콘텐츠 제작','close-and-studio','primary'))}

function approvalModal(ap){if(!ap)return;const target=ap.type==='콘텐츠'?byContent(ap.target):null;openModal('승인 검토 · '+esc(ap.title),`<div class="row wrap">${badge(ap.status)}<span class="chip">${esc(brandName(ap.brand))}</span><span class="chip">${esc(ap.type)}</span></div><h3 class="mt18">요청 내용</h3><p class="muted mt12">${esc(ap.comment)}</p>${target?`<div class="noteBox mt12"><b>콘텐츠 초안</b><p class="mt12">${esc(target.caption)}</p><p class="muted mt12">채널: ${target.channels.map(p=>names[p]).join(', ')} · 언어 ${esc(target.lang)}</p></div>`:''}<div class="field mt12"><label>반려·수정 요청 시 코멘트</label><textarea id="approvalComment" placeholder="수정이 필요한 이유를 작성하세요."></textarea></div><p class="muted tiny mt12">데모 상태만 변경됩니다. EZworks 결재 엔진 호출은 개발 후 연결합니다.</p>`,ap.status==='pending'&&canApprove()?`${btn('수정 요청','request-change','',`data-id="${ap.id}"`)}${btn('승인','approve','primary',`data-id="${ap.id}"`)}`:btn('닫기','close-modal',''))}
function actionHandler(action,id,node){if(action==='close-modal'||action==='close-modal-out'){closeModal();return}if(action==='more'){showMenu();return}if(action==='theme'){S.theme=S.theme==='dark'?'light':'dark';save();render();return}if(action==='reset'){if(confirm('이 브라우저의 데모 데이터와 변경 기록을 모두 초기화하시겠습니까?')){localStorage.removeItem(KEY);S=seed();UI={modal:null,more:false,calDate:null,shortId:'sh1',contentId:'ct1',inboxId:'in1',filter:'all',tab:'pipeline',fileUrl:null};render();toast('데모 데이터가 초기화되었습니다.')}return}
if(action==='submit-form'){let f=$('mainForm');if(f)f.requestSubmit();return}

if(action==='new-keyword'){if(!canEdit())return toast('편집 권한이 없습니다.');openModal('관찰 키워드 추가',`<form id="mainForm" data-form="keyword"><div class="formGrid">${labelField('브랜드',selectBrand('brand','pharm'))}${labelField('관심 키워드 *','<input required name="term">')}${labelField('채널',`<select name="channel">${formOpts([['Instagram','Instagram'],['TikTok','TikTok'],['YouTube','YouTube'],['小红书','小红书'],['抖音','抖音'],['Facebook','Facebook']], 'Instagram')}</select>`)}${labelField('국가',`<select name="country">${formOpts([['VN','베트남'],['KR','한국'],['CN','중국'],['PH','필리핀']], 'VN')}</select>`)}</div></form>`,btn('취소','close-modal','')+btn('저장','submit-form','primary'));return}
if(action==='keyword-brief'){let k=S.keywords.find(x=>x.id===id);if(!k)return;if(!canEdit())return toast('편집 권한이 없습니다.');modalContentForm();const f=$('mainForm');if(f){f.querySelector('[name=title]').value=k.term+' — 콘텐츠 기획';f.querySelector('[name=brand]').value=k.brand;f.querySelector('[name=caption]').value=`주제: ${k.term}\n시장: ${k.country} / ${k.channel}\n핵심 메시지와 현지화 문구는 검토 후 확정.`}return}
if(action==='new-koc'){if(!canEdit())return toast('편집 권한이 없습니다.');kocModal();return}
if(action==='koc-detail'){let k=S.kocs.find(x=>x.id===id);if(k)kocModal(k);return}

}
function kocModal(k=null){openModal(k?'KOC 협업 관리':'새 KOC 등록',`<form id="mainForm" data-form="koc" data-id="${k?.id||''}"><div class="formGrid">${labelField('브랜드',selectBrand('brand',k?.brand||'pharm'))}${labelField('크리에이터 *',`<input name="name" required value="${esc(k?.name||'')}">`)}${labelField('플랫폼',`<input name="platform" value="${esc(k?.platform||'TikTok')}">`)}${labelField('팔로워 수',`<input name="followers" type="number" min="0" value="${k?.followers||0}">`)}${labelField('협업 금액(원)',`<input name="fee" type="number" min="0" value="${k?.fee||0}">`)}${labelField('단계',`<select name="stage">${formOpts(['후보','협의','계약','샘플 발송','콘텐츠 제작','검수','게시 완료'].map(x=>[x,x]),k?.stage||'후보')}</select>`)}${labelField('샘플 상태',`<select name="sample">${formOpts(['미정','발송 준비','배송 중','배송 완료','수령'].map(x=>[x,x]),k?.sample||'미정')}</select>`)}${labelField('안전성 검토',`<select name="risk">${formOpts([['확인 필요','확인 필요'],['검토 완료','검토 완료']],k?.risk||'확인 필요')}</select>`)}</div></form>`,btn('취소','close-modal','')+btn('저장','submit-form','primary'))}
function liveModal(l=null){openModal(l?'라이브 운영 관리':'새 라이브 계획',`<form id="mainForm" data-form="live" data-id="${l?.id||''}"><div class="formGrid">${labelField('브랜드',selectBrand('brand',l?.brand||'pharm'))}${labelField('제목 *',`<input name="title" required value="${esc(l?.title||'')}">`)}${labelField('플랫폼',`<select name="platform">${formOpts([['TikTok Shop','TikTok Shop'],['抖音','抖音'],['Shopee Live','Shopee Live'],['Facebook Live','Facebook Live']],l?.platform||'TikTok Shop')}</select>`)}${labelField('일시',`<input name="when" type="datetime-local" value="${esc(l?.when||dayTime(3,'19:00'))}">`)}${labelField('호스트',`<input name="host" value="${esc(l?.host||'담당자')}">`)}${labelField('목표 매출',`<input type="number" name="goal" min="0" value="${l?.goal||0}">`)}</div>${labelField('준비 체크리스트 (한 줄 1개)',`<textarea name="check">${esc((l?.check||['대본','상품','가격·프로모션','리허설']).join('\n'))}</textarea>`)}<div class="notice mt12">실제 라이브 송출이나 쇼핑 플랫폼 주문 API를 실행하지 않습니다.</div></form>`,btn('취소','close-modal','')+btn('저장','submit-form','primary'))}
function adModal(a=null){openModal(a?'광고 성과 수정':'광고 성과 수동 등록',`<form id="mainForm" data-form="ad" data-id="${a?.id||''}"><div class="formGrid">${labelField('브랜드',selectBrand('brand',a?.brand||'pharm'))}${labelField('매체',`<select name="channel">${formOpts([['Meta','Meta'],['TikTok','TikTok'],['Google','Google'],['Shopee','Shopee'],['Lazada','Lazada'],['Douyin','Douyin']],a?.channel||'Meta')}</select>`)}${labelField('캠페인',`<select name="campaign">${formOpts(S.campaigns.map(c=>[c.id,c.name]),a?.campaign||'ca1')}</select>`)}${labelField('콘텐츠 소재',`<select name="post"><option value="">선택 안 함</option>${formOpts(S.contents.map(c=>[c.id,c.title]),a?.post||'')}</select>`)}${labelField('노출',`<input type="number" name="impressions" min="0" value="${a?.impressions||0}">`)}${labelField('클릭',`<input type="number" name="clicks" min="0" value="${a?.clicks||0}">`)}${labelField('전환',`<input type="number" name="conversions" min="0" value="${a?.conversions||0}">`)}${labelField('광고비(원)',`<input type="number" name="spent" min="0" value="${a?.spent||0}">`)}${labelField('매출(원)',`<input type="number" name="revenue" min="0" value="${a?.revenue||0}">`)}${labelField('집계 기준일',`<input type="date" name="date" value="${a?.date||dayShift(0)}">`)}</div><div class="notice warn mt12">수동 입력 데이터의 출처는 '수기'로 표시합니다. 기간 합계의 일별 임의 안분을 하지 마세요.</div></form>`,btn('취소','close-modal','')+btn('저장','submit-form','primary'),true)}
function assetModal(a=null){openModal(a?'자산 정보 편집':'새 자산 메타데이터',`<form id="mainForm" data-form="asset" data-id="${a?.id||''}"><div class="formGrid">${labelField('브랜드',selectBrand('brand',a?.brand||'pharm'))}${labelField('자산 이름 *',`<input required name="name" value="${esc(a?.name||'')}">`)}${labelField('유형',`<select name="kind">${formOpts([['image','이미지'],['video','영상'],['character','고정 모델'],['template','템플릿'],['brand','브랜드']],a?.kind||'image')}</select>`)}${labelField('출처',`<input name="source" value="${esc(a?.source||'회사 업로드')}">`)}${labelField('권리·라이선스',`<input name="license" value="${esc(a?.license||'검수 필요')}">`)}${labelField('시리즈·에피소드',`<input name="series" value="${esc(a?.series||'일반')}">`)}</div><div class="notice mt12">현재 파일 바이너리 저장 기능은 없습니다. 실제 개발 시 Supabase Storage·권한·서명 URL 연동이 필요합니다.</div></form>`,btn('취소','close-modal','')+btn('저장','submit-form','primary'))}
function brandModal(){openModal('고객사·브랜드 추가',`<form id="mainForm" data-form="brand"><div class="formGrid">${labelField('브랜드 이름 *','<input name="name" required placeholder="예: New Beauty Vietnam">')}${labelField('고객사 이름','<input name="client" placeholder="고객사 명">')}${labelField('국가',`<select name="country">${formOpts([['KR','한국'],['VN','베트남'],['PH','필리핀'],['SG','싱가포르'],['MY','말레이시아'],['TH','태국'],['ID','인도네시아'],['CN','중국']], 'VN')}</select>`)}</div></form>`,btn('취소','close-modal','')+btn('저장','submit-form','primary'))}
function handleSubmit(e){const f=e.target;if(f.id!=='mainForm')return;e.preventDefault();if(!f.reportValidity())return;if(!canEdit())return toast('편집 권한이 없습니다.');const data=new FormData(f),type=f.dataset.form,id=f.dataset.id;const v=k=>String(data.get(k)||'').trim(),num=k=>Math.max(0,Number(data.get(k)||0));
if(type==='content'){const channels=data.getAll('channels').map(String);if(!channels.length)return toast('적어도 하나의 채널을 선택하세요.');const old=byContent(id),c=old||{id:'ct'+rand()};Object.assign(c,{brand:v('brand'),campaign:v('campaign'),title:v('title'),type:v('type'),phase:v('phase'),channels,lang:v('lang'),owner:v('owner'),date:v('date'),caption:v('caption'),score:old?.score||0,manual:channels.some(x=>['naver','cafe','red'].includes(x))});if(!old)S.contents.unshift(c);if(c.phase==='review'&&!S.approvals.some(x=>x.target===c.id&&x.status==='pending'))S.approvals.unshift({id:'ap'+rand(),type:'콘텐츠',target:c.id,title:c.title,brand:c.brand,owner:c.owner,status:'pending',comment:'콘텐츠 문안·브랜드 가이드 검토',date:dayShift(0)});audit(`콘텐츠 ${old?'수정':'생성'} · ${c.title}`);}
else if(type==='campaign'){const old=S.campaigns.find(x=>x.id===id),c=old||{id:'ca'+rand(),spent:0};Object.assign(c,{brand:v('brand'),country:S.brands.find(x=>x.id===v('brand'))?.country||'KR',name:v('name'),owner:v('owner'),goal:v('goal'),budget:num('budget'),status:v('status'),start:v('start'),end:v('end')});if(!old)S.campaigns.unshift(c);audit(`캠페인 ${old?'수정':'생성'} · ${c.name}`);}
else if(type==='short'){const old=S.shorts.find(x=>x.id===id),s=old||{id:'sh'+rand()};const scenes=v('scenes').split('\n').map(x=>x.trim()).filter(Boolean);if(!scenes.length)return toast('최소 1개 장면을 입력하세요.');Object.assign(s,{brand:v('brand'),title:v('title'),goal:v('goal'),language:v('language'),scenes,ratio:'9:16',rights:data.has('rights'),status:'draft',source:s.source||'',character:s.character||'',render:'생성·렌더 연결 전'});if(!old)S.shorts.unshift(s);UI.shortId=s.id;audit(`숏폼 콘티 ${old?'수정':'등록'} · ${s.title}`);}
else if(type==='post'){let content=byContent(v('content'));if(!content)return toast('콘텐츠를 선택하세요.');const p=v('platform');const restricted=['naver','cafe','red','douyin','zalo','tiktok'];const isManual=v('method')==='manual'||restricted.includes(p);if(S.posts.some(x=>x.content===content.id&&x.platform===p&&x.status!=='hold'))return toast('동일 콘텐츠·채널의 활성 예약이 이미 있습니다. 중복 게시를 막았습니다.');let when=v('when');if(!when)return toast('예약 시각을 선택하세요.');const row={id:'p'+rand(),content:content.id,platform:p,when,status:isManual?'manual':'scheduled',note:isManual?'수동 또는 플랫폼 심사 조건부. 외부 자동 게시 안 함.':'시연용 예약 큐. API 호출 안 함.'};S.posts.unshift(row);content.phase='scheduled';content.date=when;audit(`게시 예약 등록 · ${content.title} · ${names[p]}`);}
else if(type==='koc'){const old=S.kocs.find(x=>x.id===id),k=old||{id:'k'+rand(),owner:'마케팅팀'};Object.assign(k,{brand:v('brand'),name:v('name'),platform:v('platform'),followers:num('followers'),fee:num('fee'),stage:v('stage'),sample:v('sample'),risk:v('risk')});if(!old)S.kocs.unshift(k);audit(`KOC 협업 저장 · ${k.name}`);}
else if(type==='live'){const old=S.lives.find(x=>x.id===id),l=old||{id:'li'+rand(),sales:0,status:'기획 중'};Object.assign(l,{brand:v('brand'),title:v('title'),platform:v('platform'),host:v('host'),when:v('when'),goal:num('goal'),check:v('check').split('\n').map(x=>x.trim()).filter(Boolean)});if(!old)S.lives.unshift(l);audit(`라이브 계획 저장 · ${l.title}`);}
else if(type==='ad'){const old=S.ads.find(x=>x.id===id),a=old||{id:'ad'+rand()};Object.assign(a,{brand:v('brand'),channel:v('channel'),campaign:v('campaign'),post:v('post'),impressions:num('impressions'),clicks:num('clicks'),conversions:num('conversions'),spent:num('spent'),revenue:num('revenue'),date:v('date'),source:'수기'});if(!old)S.ads.unshift(a);audit(`광고 데이터 저장 · ${a.channel}`);}
else if(type==='asset'){const old=S.assets.find(x=>x.id===id),a=old||{id:'as'+rand()};Object.assign(a,{brand:v('brand'),name:v('name'),kind:v('kind'),source:v('source'),license:v('license'),series:v('series'),icon:{image:'🖼️',video:'🎬',character:'👩🏻',template:'🧩',brand:'✦'}[v('kind')]});if(!old)S.assets.unshift(a);audit(`자산 저장 · ${a.name}`);}
else if(type==='keyword'){const k={id:'kw'+rand(),brand:v('brand'),term:v('term'),channel:v('channel'),country:v('country'),status:'추적 대상'};S.keywords.unshift(k);audit(`키워드 등록 · ${k.term}`);}
else if(type==='brand'){const b={id:'brand'+rand(),name:v('name'),client:v('client'),country:v('country'),color:'#b79aff'};S.brands.push(b);audit(`브랜드 추가 · ${b.name}`);}
else return;closeModal();save();render();toast('저장했습니다. 데모 데이터에만 반영됩니다.');}
function downloadCSV(rows,name){const quote=s=>'"'+String(s??'').replace(/"/g,'""')+'"';const content='\ufeff'+rows.map(r=>r.map(quote).join(',')).join('\r\n');const blob=new Blob([content],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)}
function showMenu(){let menu=$('menuRoot');menu.innerHTML=`<div class="menuDrawer" data-action="hide-menu"><div class="menuInner" onclick="event.stopPropagation()"><div class="row between" style="margin-bottom:13px"><b>전체 업무 기능</b><button class="btn sm" data-action="hide-menu">✕</button></div>${pages.map(x=>`<button data-page="${x[0]}">${esc(label(x[0]))}</button>`).join('')}<div class="rule"></div><label class="tiny">언어</label><select id="menuLang" style="width:100%">${formOpts([['ko','한국어'],['en','English'],['vi','Tiếng Việt'],['zh','中文']],S.lang)}</select><label class="tiny mt12">역할(시연)</label><select id="menuRole" style="width:100%">${formOpts([['admin','관리자'],['staff','베트남 직원'],['client','외부 고객']],S.role)}</select></div></div>`;}
function handleActionClick(e){const target=e.target.closest('[data-page],[data-action]');if(!target)return;const p=target.dataset.page;const act=target.dataset.action;const id=target.dataset.id;if(act==='close-modal-out'&&e.target!==target)return;if(p){e.preventDefault();if($('menuRoot'))$('menuRoot').innerHTML='';if(p!==S.page)UI.filter='all';go(p);return}if(act==='hide-menu'){e.preventDefault();$('menuRoot').innerHTML='';return}if(act){e.preventDefault();actionHandler(act,id,target)}}
function wire(){document.addEventListener('click',handleActionClick);document.addEventListener('submit',handleSubmit);document.addEventListener('change',e=>{const t=e.target;if(t.id==='brandPick'){S.brand=t.value;save();render()}else if(t.id==='langPick'||t.id==='menuLang'){S.lang=t.value;save();render()}else if(t.id==='rolePick'||t.id==='menuRole'){S.role=t.value;if(S.role==='client')S.brand='pharm';else if(S.role==='staff'&&!['pharm','kclean','all'].includes(S.brand))S.brand='all';save();render();toast('역할 미리보기를 변경했습니다. 실제 접근권한과 무관한 UI 시연입니다.')}else if(t.id==='stageFilter'){UI.filter=t.value;render()}});document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(UI.modal)closeModal();$('menuRoot').innerHTML=''}});}
wire();render();
</script></body></html>
