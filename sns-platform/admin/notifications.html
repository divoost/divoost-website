<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>공지 관리 | 관리자</title>
    <!-- 디자인 시스템(DDS) + 관리자 셸 + 자체호스팅 폰트(외부 CDN 미사용). 기존 sns.css 유지. -->
    <link rel="stylesheet" href="../vendor/pretendard/pretendardvariable.css">
    <link rel="stylesheet" href="../css/design-system.css">
    <link rel="stylesheet" href="../css/ds-shell.css">
    <link rel="stylesheet" href="../css/sns.css">
    <style>
        .card{background:var(--ds-bg-surface);border-radius:14px;border:1px solid var(--ds-border);padding:20px;margin-bottom:16px}
        .card h2{font-size:1rem;margin-bottom:14px;color:var(--ds-text-primary)}

        .form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
        .form-group{display:flex;flex-direction:column;gap:5px}
        .form-group.full{grid-column:1/-1}
        .form-group label{font-size:.74rem;font-weight:600;color:var(--ds-text-secondary)}
        .form-group input,.form-group select,.form-group textarea{padding:9px 12px;border-radius:8px;border:1px solid var(--ds-border);background:var(--ds-bg-surface);color:var(--ds-text-primary);font-size:.85rem;font-family:inherit}
        .form-group textarea{min-height:120px;resize:vertical}

        .target-chip-group{display:flex;gap:8px;flex-wrap:wrap}
        .target-chip{padding:7px 14px;border-radius:20px;border:2px solid var(--ds-border);background:var(--ds-bg-surface);font-size:.78rem;cursor:pointer;font-weight:600;color:var(--ds-text-secondary);user-select:none}
        .target-chip.active{border-color:var(--ds-accent);background:var(--ds-accent-soft-bg);color:var(--ds-accent-soft-fg)}

        .btn-action{padding:10px 24px;border-radius:8px;border:none;font-weight:700;font-size:.85rem;cursor:pointer}
        .btn-send{background:var(--ds-accent);color:#fff}
        .btn-draft{background:var(--ds-bg-subtle);color:var(--ds-text-secondary)}

        .notice-list{margin-top:14px}
        .notice-item{padding:14px;border-radius:10px;background:var(--ds-bg-subtle);margin-bottom:8px;border:1px solid var(--ds-border)}
        .notice-item-header{display:flex;align-items:center;gap:10px;margin-bottom:6px}
        .notice-tag{font-size:.66rem;padding:2px 8px;border-radius:6px;font-weight:700}
        .notice-tag.공지{background:var(--ds-accent-soft-bg);color:var(--ds-accent-soft-fg)}
        .notice-tag.업데이트{background:var(--ds-success-bg);color:var(--ds-success-fg)}
        .notice-tag.긴급{background:var(--ds-danger-bg);color:var(--ds-danger-fg)}
        .notice-tag.이벤트{background:var(--ds-warning-bg);color:var(--ds-warning-fg)}
        .notice-title{font-weight:700;flex:1;color:var(--ds-text-primary)}
        .notice-meta{font-size:.7rem;color:var(--ds-text-tertiary)}
        .notice-body{font-size:.82rem;color:var(--ds-text-secondary);line-height:1.6}
    </style>
</head>
<body class="ds-root" data-shell-active="notifications">
    <main class="d-screen">
        <div class="d-page-head">
            <div>
                <div class="ds-eyebrow">DIVOOST SNS · ADMIN</div>
                <h1 class="ds-h1">공지 관리</h1>
                <p class="ds-body">공지를 작성·발송하고 이력을 확인합니다.</p>
            </div>
        </div>

        <div class="card">
            <h2 class="d-sect-t">📝 새 공지 작성</h2>
            <div class="form-row">
                <div class="form-group">
                    <label>유형</label>
                    <select id="noticeType">
                        <option value="공지">공지</option>
                        <option value="업데이트">업데이트</option>
                        <option value="이벤트">이벤트</option>
                        <option value="긴급">긴급</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>발송 시간</label>
                    <input type="datetime-local" id="noticeTime">
                </div>
            </div>
            <div class="form-group full">
                <label>제목</label>
                <input type="text" id="noticeTitle" placeholder="예: 5월 신규 기능 안내">
            </div>
            <div class="form-group full">
                <label>내용</label>
                <textarea id="noticeBody" placeholder="공지 내용 입력 (마크다운 지원)..."></textarea>
            </div>
            <div class="form-group full">
                <label>발송 대상</label>
                <div class="target-chip-group" id="targetChips">
                    <span class="target-chip active" data-target="all" onclick="toggleTarget(this)">전체 회원</span>
                    <span class="target-chip" data-target="trial" onclick="toggleTarget(this)">체험 플랜</span>
                    <span class="target-chip" data-target="pro" onclick="toggleTarget(this)">PRO 플랜</span>
                    <span class="target-chip" data-target="enterprise" onclick="toggleTarget(this)">Enterprise</span>
                    <span class="target-chip" data-target="active" onclick="toggleTarget(this)">활성 회원</span>
                    <span class="target-chip" data-target="inactive" onclick="toggleTarget(this)">미활성 회원</span>
                </div>
            </div>
            <div class="form-group full">
                <label>발송 채널</label>
                <div class="target-chip-group">
                    <span class="target-chip active">📢 인앱 공지</span>
                    <span class="target-chip">📧 이메일</span>
                    <span class="target-chip">📱 푸시 알림</span>
                </div>
            </div>
            <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px">
                <button class="btn-action btn-draft" onclick="saveDraft()">💾 임시저장</button>
                <button class="btn-action btn-send" onclick="sendNotice()">📤 발송</button>
            </div>
        </div>

        <div class="card">
            <h2 class="d-sect-t">📜 최근 발송 공지</h2>
            <div class="notice-list">
                <p style="color:var(--ds-text-tertiary);font-size:.84rem">로딩 중...</p>
            </div>
        </div>
    </main>
    <script src="../js/secure-storage.js"></script>
    <script src="../js/auth-guard.js"></script>
    <script src="../js/supabase-admin.js"></script>
    <script>
        function toggleTarget(el){ el.classList.toggle('active'); }
        function saveDraft(){
            localStorage.setItem('noticeDraft', JSON.stringify({
                type: document.getElementById('noticeType').value,
                title: document.getElementById('noticeTitle').value,
                body: document.getElementById('noticeBody').value
            }));
            alert('💾 임시저장 완료');
        }
        async function sendNotice(){
            var title = document.getElementById('noticeTitle').value.trim();
            var body = document.getElementById('noticeBody').value.trim();
            var type = document.getElementById('noticeType').value;
            if(!title || !body){ alert('⚠️ 제목과 내용을 입력하세요'); return; }

            // 활성화된 첫 타겟 칩 찾기
            var targetChip = document.querySelector('#targetChips .target-chip.active');
            var targetPlan = targetChip ? targetChip.dataset.target : 'all';

            if(!confirm('📤 공지를 발송합니다.\n\n대상: ' + targetPlan + '\n제목: ' + title + '\n\n계속하시겠습니까?')) return;

            var result = await SNSAdmin.sendNotice({
                type: type,
                title: title,
                body: body,
                targetPlan: targetPlan
            });
            if(result.ok){
                alert('✅ 공지가 저장되었습니다 (인앱 알림).\n\n⚠️ 개발 필요: 이메일/푸시 발송 백엔드 미연동\n필요 작업: Resend/SendGrid + 푸시 알림 (Web Push API) 연동');
                document.getElementById('noticeTitle').value = '';
                document.getElementById('noticeBody').value = '';
                loadRecentNotices();
            } else {
                alert('❌ 발송 실패: ' + (result.data && result.data.message || ''));
            }
        }

        async function loadRecentNotices(){
            var list = document.querySelector('.notice-list');
            if(!list) return;
            try {
                var notices = await SNSAdmin.listNotices(5);
                if(!notices || notices.length === 0){
                    list.innerHTML = '<p style="color:var(--ds-text-tertiary);font-size:.84rem;padding:20px;text-align:center">발송된 공지가 없습니다.</p>';
                    return;
                }
                list.innerHTML = notices.map(function(n){
                    var date = n.sent_at ? new Date(n.sent_at).toISOString().slice(0,10).replace(/-/g,'.') : '';
                    return '<div class="notice-item">' +
                        '<div class="notice-item-header">' +
                            '<span class="notice-tag ' + (n.type === 'general' ? '공지' : (n.type === 'update' ? '업데이트' : (n.type === 'urgent' ? '긴급' : '이벤트'))) + '">' + (n.type === 'general' ? '공지' : (n.type === 'update' ? '업데이트' : (n.type === 'urgent' ? '긴급' : '이벤트'))) + '</span>' +
                            '<span class="notice-title">' + n.title + '</span>' +
                            '<span class="notice-meta">' + date + ' · ' + (n.sent_to_count || 0) + '명 발송</span>' +
                        '</div>' +
                        '<div class="notice-body">' + n.body + '</div>' +
                    '</div>';
                }).join('');
            } catch(err){
                console.error('공지 로딩 실패:', err);
                list.innerHTML = '<div class="dev-needed-badge" style="background:var(--ds-warning-bg);border:1px solid var(--ds-warning-500);color:var(--ds-warning-fg);padding:10px 14px;border-radius:8px;font-size:13px;font-weight:600;">⚠️ 개발 필요: notices 테이블 없음 (필요 작업: docs/supabase-admin-schema.sql 참고)</div>';
            }
        }

        (async function(){
            var ok = await SNSAdmin.requireAdmin();
            if(!ok) return;
            // 임시저장 복원
            var draft = JSON.parse(localStorage.getItem('noticeDraft') || 'null');
            if(draft){
                if(draft.type) document.getElementById('noticeType').value = draft.type;
                if(draft.title) document.getElementById('noticeTitle').value = draft.title;
                if(draft.body) document.getElementById('noticeBody').value = draft.body;
            }
            await loadRecentNotices();
        })();
    </script>

    <!-- DDS 공통 셸(상단바/네비/드로어/테마/아이콘) -->
    <script src="../vendor/lucide/lucide.min.js"></script>
    <script src="../js/ds-shell-admin.js"></script>
</body>
</html>
