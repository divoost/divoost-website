<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>활동 로그 | 관리자</title>
    <!-- 디자인 시스템(DDS) + 관리자 셸 + 자체호스팅 폰트(외부 CDN 미사용). 기존 sns.css 유지. -->
    <link rel="stylesheet" href="../vendor/pretendard/pretendardvariable.css">
    <link rel="stylesheet" href="../css/design-system.css">
    <link rel="stylesheet" href="../css/ds-shell.css">
    <link rel="stylesheet" href="../css/sns.css">
    <style>
        .card{background:var(--ds-bg-surface);border-radius:14px;border:1px solid var(--ds-border);padding:20px;margin-bottom:16px}
        .card h2{font-size:1rem;margin-bottom:14px;color:var(--ds-text-primary)}

        .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
        .tb-input,.tb-select{padding:8px 12px;border-radius:8px;border:1px solid var(--ds-border);font-size:.82rem;background:var(--ds-bg-surface);color:var(--ds-text-primary)}
        .tb-input{flex:1;min-width:240px}

        .activity-feed{background:var(--ds-bg-surface);border-radius:12px;border:1px solid var(--ds-border);overflow:hidden}
        .activity-item{display:flex;gap:14px;padding:14px 18px;border-bottom:1px solid var(--ds-border-subtle);transition:.15s}
        .activity-item:hover{background:var(--ds-bg-hover)}
        .activity-item:last-child{border-bottom:none}
        .activity-icon{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
        .activity-icon.login{background:var(--ds-accent-soft-bg)}
        .activity-icon.post{background:var(--ds-success-bg)}
        .activity-icon.connect{background:var(--ds-accent-soft-bg)}
        .activity-icon.delete{background:var(--ds-danger-bg)}
        .activity-icon.update{background:var(--ds-warning-bg)}
        .activity-icon.payment{background:var(--ds-warning-bg)}
        .activity-body{flex:1;min-width:0}
        .activity-user{font-weight:700;font-size:.85rem;color:var(--ds-text-primary)}
        .activity-action{font-size:.84rem;color:var(--ds-text-secondary);margin-top:2px}
        .activity-meta{font-size:.7rem;color:var(--ds-text-tertiary);margin-top:4px;display:flex;gap:10px}

        .stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
        .stat-card{background:var(--ds-bg-surface);border-radius:12px;border:1px solid var(--ds-border);padding:16px;text-align:center}
        .stat-val{font-size:1.5rem;font-weight:800;color:var(--ds-text-primary)}
        .stat-label{font-size:.72rem;color:var(--ds-text-tertiary);margin-top:2px}
    </style>
</head>
<body class="ds-root" data-shell-active="user-activity">
    <main class="d-screen">
        <div class="d-page-head">
            <div>
                <div class="ds-eyebrow">DIVOOST SNS · ADMIN</div>
                <h1 class="ds-h1">활동 로그</h1>
                <p class="ds-body">사용자 활동 로그를 조회합니다.</p>
            </div>
        </div>

        <div class="stat-row">
            <div class="stat-card"><div class="stat-val" id="sToday" style="color:var(--ds-accent)">0</div><div class="stat-label">오늘 활동</div></div>
            <div class="stat-card"><div class="stat-val" id="sPublish" style="color:var(--ds-success-500)">0</div><div class="stat-label">발행 활동</div></div>
            <div class="stat-card"><div class="stat-val" id="sConnect" style="color:var(--ds-accent-500)">0</div><div class="stat-label">신규 연동</div></div>
            <div class="stat-card"><div class="stat-val" id="sPayment" style="color:var(--ds-warning-500)">0</div><div class="stat-label">결제 이벤트</div></div>
        </div>

        <div class="card">
            <h2>🔍 필터</h2>
            <div class="toolbar">
                <input type="text" class="tb-input" placeholder="사용자 이메일 검색...">
                <select class="tb-select">
                    <option>모든 활동</option>
                    <option>로그인</option>
                    <option>발행</option>
                    <option>SNS 연동</option>
                    <option>삭제</option>
                    <option>결제</option>
                </select>
                <select class="tb-select">
                    <option>최근 1시간</option>
                    <option>최근 24시간</option>
                    <option>최근 7일</option>
                    <option>최근 30일</option>
                </select>
            </div>

            <div class="activity-feed">
                <p style="padding:30px;text-align:center;color:var(--ds-text-tertiary);font-size:.84rem">로딩 중...</p>
            </div>
        </div>
    </main>
    <script src="../js/secure-storage.js"></script>
    <script src="../js/auth-guard.js"></script>
    <script src="../js/supabase-admin.js"></script>
    <script>
        function formatRelativeTime(iso){
            if(!iso) return '-';
            var d = new Date(iso);
            var diff = (Date.now() - d.getTime()) / 1000;
            if(diff < 60) return Math.floor(diff) + '초 전';
            if(diff < 3600) return Math.floor(diff/60) + '분 전';
            if(diff < 86400) return Math.floor(diff/3600) + '시간 전';
            return Math.floor(diff/86400) + '일 전';
        }

        async function loadActivities(){
            var feed = document.querySelector('.activity-feed');
            try {
                var activities = await SNSAdmin.listActivities({limit: 50});
                if(!feed) return;
                if(!activities || activities.length === 0){
                    feed.innerHTML = '<p style="padding:30px;text-align:center;color:var(--ds-text-tertiary);font-size:.84rem">활동 로그가 없습니다.</p>';
                    return;
                }
                // 통계 집계
                var today = new Date().toISOString().slice(0,10);
                var todayCount = activities.filter(function(a){ return (a.created_at||'').slice(0,10) === today; }).length;
                document.getElementById('sToday').textContent = todayCount;
                document.getElementById('sPublish').textContent = activities.filter(function(a){ return a.action_type === 'PUBLISH'; }).length;
                document.getElementById('sConnect').textContent = activities.filter(function(a){ return a.action_type === 'SNS_CONNECT'; }).length;
                document.getElementById('sPayment').textContent = activities.filter(function(a){ return a.action_type === 'PAYMENT'; }).length;

                var iconMap = {
                    LOGIN: {icon:'🔐', cls:'login'},
                    LOGOUT: {icon:'🔓', cls:'login'},
                    PUBLISH: {icon:'📤', cls:'post'},
                    SNS_CONNECT: {icon:'🔗', cls:'connect'},
                    PAYMENT: {icon:'💳', cls:'payment'},
                    SETTINGS_UPDATE: {icon:'✏️', cls:'update'},
                    DELETE: {icon:'🗑', cls:'delete'}
                };

                feed.innerHTML = activities.map(function(a){
                    var info = iconMap[a.action_type] || {icon:'📋', cls:'update'};
                    var time = formatRelativeTime(a.created_at);
                    var t = a.created_at ? new Date(a.created_at).toTimeString().slice(0,8) : '';
                    return '<div class="activity-item">' +
                        '<div class="activity-icon ' + info.cls + '">' + info.icon + '</div>' +
                        '<div class="activity-body">' +
                            '<div class="activity-user">' + (a.user_email || '-') + '</div>' +
                            '<div class="activity-action">' + (a.action_detail || a.action_type || '-') + '</div>' +
                            '<div class="activity-meta"><span>' + t + ' (' + time + ')</span>' +
                                (a.ip_address ? '<span>IP: ' + a.ip_address + '</span>' : '') +
                            '</div>' +
                        '</div>' +
                    '</div>';
                }).join('');
            } catch(err){
                console.error('활동 로드 실패:', err);
                if(feed) feed.innerHTML = '<div class="dev-needed-badge" style="background:var(--ds-warning-bg);border:1px solid var(--ds-warning-500);color:var(--ds-warning-fg);padding:10px 14px;border-radius:8px;font-size:13px;font-weight:600;">⚠️ 개발 필요: user_activities 테이블 없음 (필요 작업: docs/supabase-admin-schema.sql 참고)</div>';
            }
        }

        (async function(){
            var ok = await SNSAdmin.requireAdmin();
            if(!ok) return;
            await loadActivities();
        })();
    </script>
    <script src="../vendor/lucide/lucide.min.js"></script>
    <script src="../js/ds-shell-admin.js"></script>
</body>
</html>
