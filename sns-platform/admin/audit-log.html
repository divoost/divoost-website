<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>감사 로그 | 관리자</title>
    <!-- 디자인 시스템(DDS) + 관리자 셸 + 자체호스팅 폰트(외부 CDN 미사용). 기존 sns.css 유지. -->
    <link rel="stylesheet" href="../vendor/pretendard/pretendardvariable.css">
    <link rel="stylesheet" href="../css/design-system.css">
    <link rel="stylesheet" href="../css/ds-shell.css">
    <link rel="stylesheet" href="../css/sns.css">
    <style>
        .card{background:var(--ds-bg-surface);border-radius:14px;border:1px solid var(--ds-border);padding:20px;margin-bottom:16px}

        .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
        .tb-select,.tb-input{padding:8px 12px;border-radius:8px;border:1px solid var(--ds-border);font-size:.82rem;background:var(--ds-bg-surface);color:var(--ds-text-primary)}
        .tb-input{flex:1;min-width:240px}
        .btn{padding:8px 16px;border-radius:8px;border:none;font-size:.78rem;font-weight:700;cursor:pointer}
        .btn.primary{background:var(--ds-accent);color:#fff}
        .btn.secondary{background:var(--ds-bg-subtle);color:var(--ds-text-secondary)}

        .log-table{width:100%;border-collapse:collapse;font-size:.82rem}
        .log-table th{background:var(--ds-bg-subtle);padding:10px 12px;text-align:left;font-size:.7rem;font-weight:700;color:var(--ds-text-secondary);text-transform:uppercase}
        .log-table td{padding:10px 12px;border-bottom:1px solid var(--ds-border);font-family:Menlo,Monaco,monospace;font-size:.78rem;color:var(--ds-text-primary)}
        .log-table tr:hover{background:var(--ds-bg-hover)}
        .log-table .actor{font-weight:700;color:var(--ds-text-primary)}
        .severity{display:inline-block;padding:2px 8px;border-radius:6px;font-size:.66rem;font-weight:700}
        .severity.info{background:var(--ds-accent-soft-bg);color:var(--ds-accent-soft-fg)}
        .severity.warn{background:var(--ds-warning-bg);color:var(--ds-warning-fg)}
        .severity.critical{background:var(--ds-danger-bg);color:var(--ds-danger-fg)}
        .severity.success{background:var(--ds-success-bg);color:var(--ds-success-fg)}
    </style>
</head>
<body class="ds-root" data-shell-active="audit-log">
    <main class="d-screen">
        <div class="d-page-head">
            <div>
                <div class="ds-eyebrow">DIVOOST SNS · ADMIN</div>
                <h1 class="ds-h1">감사 로그</h1>
                <p class="ds-body">관리자 활동·보안 이벤트를 조회하고 내보냅니다.</p>
            </div>
        </div>

        <div class="card">
            <h2 class="d-sect-t">🔍 필터</h2>
            <div class="toolbar">
                <input type="text" class="tb-input" placeholder="관리자, 대상, 액션으로 검색...">
                <select class="tb-select">
                    <option>모든 액션</option>
                    <option>회원 정지/해제</option>
                    <option>콘텐츠 삭제</option>
                    <option>공지 발송</option>
                    <option>설정 변경</option>
                    <option>로그인/로그아웃</option>
                </select>
                <select class="tb-select">
                    <option>모든 심각도</option>
                    <option>Info</option>
                    <option>Warning</option>
                    <option>Critical</option>
                </select>
                <button class="btn primary">📥 CSV 다운로드</button>
            </div>

            <table class="log-table">
                <thead>
                    <tr>
                        <th>시간</th>
                        <th>심각도</th>
                        <th>관리자</th>
                        <th>액션</th>
                        <th>대상</th>
                        <th>IP</th>
                        <th>결과</th>
                    </tr>
                </thead>
                <tbody>
                    <tr><td colspan="7" style="padding:24px;text-align:center;color:var(--ds-text-tertiary)">로딩 중...</td></tr>
                </tbody>
            </table>
        </div>

        <div class="card">
            <h2 class="d-sect-t">📝 감사 로그 정책</h2>
            <p style="font-size:.84rem;color:var(--ds-text-secondary);line-height:1.8">
                • 모든 관리자 작업은 자동으로 기록됩니다 (변경/삭제 불가)<br>
                • 보관 기간: <strong>5년</strong> (개인정보보호법 권고)<br>
                • Critical 액션 (계정 삭제, 정지 등)은 즉시 알림 발송<br>
                • 로그인 시도는 성공/실패 모두 기록<br>
                • IP 주소, User-Agent, 작업 내용 모두 보관<br>
                • CSV 내보내기 가능 (월 1회 정기 백업 권장)
            </p>
        </div>
    </main>
    <script src="../js/secure-storage.js"></script>
    <script src="../js/auth-guard.js"></script>
    <script src="../js/supabase-admin.js"></script>
    <script>
        async function loadAuditLogs(){
            try {
                var logs = await SNSAdmin.listAuditLogs({limit: 100});
                var tbody = document.querySelector('.log-table tbody');
                if(!tbody) return;
                if(!logs || logs.length === 0){
                    tbody.innerHTML = '<tr><td colspan="7" style="padding:24px;text-align:center;color:var(--ds-text-tertiary)">감사 로그가 없습니다.</td></tr>';
                    return;
                }
                tbody.innerHTML = logs.map(function(log){
                    var t = log.created_at ? new Date(log.created_at).toISOString().slice(0,19).replace('T',' ') : '-';
                    var sevClass = log.severity || 'info';
                    var sevUpper = (log.severity || 'INFO').toUpperCase();
                    var resultClass = log.success ? 'success' : 'critical';
                    var resultText = log.success ? 'SUCCESS' : 'FAILED';
                    return '<tr>' +
                        '<td>' + t + '</td>' +
                        '<td><span class="severity ' + sevClass + '">' + sevUpper + '</span></td>' +
                        '<td class="actor">' + (log.admin_email || '-') + '</td>' +
                        '<td>' + (log.action || '-') + '</td>' +
                        '<td>' + (log.target || '-') + '</td>' +
                        '<td>' + (log.ip_address || '-') + '</td>' +
                        '<td><span class="severity ' + resultClass + '">' + resultText + '</span></td>' +
                    '</tr>';
                }).join('');
            } catch(err){
                console.error('Audit log load error:', err);
                var tbody = document.querySelector('.log-table tbody');
                if(tbody) tbody.innerHTML = '<tr><td colspan="7"><div class="dev-needed-badge" style="background:var(--ds-warning-bg);border:1px solid var(--ds-warning-500);color:var(--ds-warning-fg);padding:10px;border-radius:8px;font-size:13px;font-weight:600;">⚠️ 개발 필요: audit_logs 테이블 없음 (필요한 작업: docs/supabase-admin-schema.sql의 audit_logs 테이블 생성)</div></td></tr>';
            }
        }

        (async function(){
            var ok = await SNSAdmin.requireAdmin();
            if(!ok) return;
            await loadAuditLogs();
        })();
    </script>
    <script src="../vendor/lucide/lucide.min.js"></script>
    <script src="../js/ds-shell-admin.js"></script>
</body>
</html>
