<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API 사용량 모니터 | 관리자</title>
    <!-- 디자인 시스템(DDS) + 관리자 셸 + 자체호스팅 폰트(외부 CDN 미사용). 기존 sns.css 유지. -->
    <link rel="stylesheet" href="../vendor/pretendard/pretendardvariable.css">
    <link rel="stylesheet" href="../css/design-system.css">
    <link rel="stylesheet" href="../css/ds-shell.css">
    <link rel="stylesheet" href="../css/sns.css">
    <style>
        .api-card{background:var(--ds-bg-surface);border-radius:14px;border:1px solid var(--ds-border);padding:20px;margin-bottom:16px}
        .api-card h2{font-size:1rem;margin-bottom:14px}

        .platform-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
        .platform-card{padding:18px;border-radius:12px;background:var(--ds-bg-subtle);border:1px solid var(--ds-border)}
        .platform-card-header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
        .platform-icon{font-size:28px;width:44px;height:44px;border-radius:10px;background:var(--ds-bg-surface);display:flex;align-items:center;justify-content:center}
        .platform-name{font-weight:700;font-size:.92rem}
        .usage-bar{height:10px;background:var(--ds-bg-subtle);border-radius:5px;overflow:hidden;margin:8px 0}
        .usage-bar-fill{height:100%;border-radius:5px;transition:width .3s}
        .usage-bar-fill.ok{background:linear-gradient(90deg,var(--ds-success-500),var(--ds-success-600))}
        .usage-bar-fill.warn{background:linear-gradient(90deg,var(--ds-warning-500),var(--ds-warning-600))}
        .usage-bar-fill.danger{background:linear-gradient(90deg,var(--ds-danger-500),var(--ds-danger-600))}
        .usage-text{display:flex;justify-content:space-between;font-size:.72rem;color:var(--ds-text-secondary);font-weight:600}
        .usage-pct{font-size:1.4rem;font-weight:800;color:var(--ds-text-primary);margin:8px 0 4px}

        .log-table{width:100%;border-collapse:collapse;font-size:.82rem}
        .log-table th{background:var(--ds-bg-subtle);padding:10px 12px;text-align:left;font-size:.7rem;font-weight:700;color:var(--ds-text-secondary)}
        .log-table td{padding:10px 12px;border-bottom:1px solid var(--ds-border-subtle)}
        .log-pill{display:inline-block;padding:2px 8px;border-radius:10px;font-size:.66rem;font-weight:700}
        .log-pill.success{background:var(--ds-success-bg);color:var(--ds-success-fg)}
        .log-pill.error{background:var(--ds-danger-bg);color:var(--ds-danger-fg)}
        .log-pill.warn{background:var(--ds-warning-bg);color:var(--ds-warning-fg)}
    </style>
</head>
<body class="ds-root" data-shell-active="api-monitor">
    <main class="d-screen">
        <div class="d-page-head">
            <div>
                <div class="ds-eyebrow">DIVOOST SNS · ADMIN</div>
                <h1 class="ds-h1">API 사용량 모니터</h1>
                <p class="ds-body">외부 API 사용량과 호출 로그를 모니터링합니다.</p>
            </div>
        </div>

                <div class="api-card">
                    <h2>📊 오늘의 API 사용량</h2>
                    <div id="apiUsageWrap">
                        <p style="color:var(--ds-text-tertiary);font-size:.84rem">로딩 중...</p>
                    </div>
                </div>

                <div class="api-card">
                    <h2>📜 최근 API 호출 로그</h2>
                    <div id="apiLogsWrap">
                        <p style="color:var(--ds-text-tertiary);font-size:.84rem">로딩 중...</p>
                    </div>
                </div>

                <div class="api-card">
                    <h2>⚠️ 한도 초과 알림</h2>
                    <div class="dev-needed-badge" style="background:var(--ds-warning-bg);border:1px solid var(--ds-warning-500);color:var(--ds-warning-fg);padding:10px 14px;border-radius:8px;margin-bottom:12px;font-size:13px;font-weight:600;">
                        ⚠️ 개발 필요: 자동 알림 시스템 미구현 (필요한 작업: pg_cron 또는 Edge Function 스케줄러 + 임계치 비교 + 이메일 발송)
                    </div>
                    <p style="font-size:.84rem;color:var(--ds-text-secondary);line-height:1.6">
                        예정 조건:<br>
                        • API 사용량 80% 도달 시<br>
                        • 1시간 내 에러율 10% 초과<br>
                        • 특정 사용자가 1일 한도 초과
                    </p>
                </div>
    </main>
    <script src="../js/secure-storage.js"></script>
    <script src="../js/auth-guard.js"></script>
    <script src="../js/supabase-admin.js"></script>
    <script>
        function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; }); }

        async function loadApiData(){
            try {
                var usage = await SNSAdmin.getApiUsage({});
                var wrap = document.getElementById('apiUsageWrap');
                var platforms = Object.keys(usage || {});
                if(platforms.length === 0){
                    wrap.innerHTML = '<div class="dev-needed-badge" style="background:var(--ds-warning-bg);border:1px solid var(--ds-warning-500);color:var(--ds-warning-fg);padding:10px 14px;border-radius:8px;font-size:13px;font-weight:600;">⚠️ 개발 필요: api_usage_logs 테이블이 비어있거나 미생성 (필요 작업: api_usage_logs 테이블 생성 + 각 API 호출 시 logApiCall 호출)</div>';
                } else {
                    wrap.innerHTML = '<div class="platform-row">' + platforms.map(function(p){
                        var u = usage[p];
                        return '<div class="platform-card"><div class="platform-card-header"><div class="platform-icon">📡</div><div><div class="platform-name">' + escapeHtml(p) + '</div></div></div>' +
                            '<div class="usage-pct">' + (u.count || 0) + '</div>' +
                            '<div class="usage-text"><span>호출 수</span><span>에러: ' + (u.errors || 0) + '</span></div>' +
                            '<div class="usage-text"><span>평균 지연</span><span>' + (u.avgLatency || 0) + 'ms</span></div></div>';
                    }).join('') + '</div>';
                }
            } catch(err){
                console.error('API 사용량 로딩 실패:', err);
                document.getElementById('apiUsageWrap').innerHTML = '<div class="dev-needed-badge" style="background:var(--ds-warning-bg);border:1px solid var(--ds-warning-500);color:var(--ds-warning-fg);padding:10px 14px;border-radius:8px;font-size:13px;font-weight:600;">⚠️ 개발 필요: api_usage_logs 테이블 미생성 (필요 작업: docs/supabase-admin-schema.sql 참고)</div>';
            }
            document.getElementById('apiLogsWrap').innerHTML = '<div class="dev-needed-badge" style="background:var(--ds-warning-bg);border:1px solid var(--ds-warning-500);color:var(--ds-warning-fg);padding:10px 14px;border-radius:8px;font-size:13px;font-weight:600;">⚠️ 개발 필요: 상세 호출 로그 표시 미구현 (필요 작업: api_usage_logs 최근 100건 조회 RPC)</div>';
        }

        (async function(){
            var ok = await SNSAdmin.requireAdmin();
            if(!ok) return;
            await loadApiData();
        })();
    </script>

    <!-- DDS 공통 셸(상단바/네비/드로어/테마/아이콘) -->
    <script src="../vendor/lucide/lucide.min.js"></script>
    <script src="../js/ds-shell-admin.js"></script>
</body>
</html>
