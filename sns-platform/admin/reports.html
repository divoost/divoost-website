<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>신고/제재 | 관리자</title>
    <!-- 디자인 시스템(DDS) + 관리자 셸 + 자체호스팅 폰트(외부 CDN 미사용). 기존 sns.css 유지. -->
    <link rel="stylesheet" href="../vendor/pretendard/pretendardvariable.css">
    <link rel="stylesheet" href="../css/design-system.css">
    <link rel="stylesheet" href="../css/ds-shell.css">
    <link rel="stylesheet" href="../css/sns.css">
    <style>
        .card{background:var(--ds-bg-surface);border-radius:14px;border:1px solid var(--ds-border);padding:20px;margin-bottom:16px}
        .card h2{font-size:1rem;margin-bottom:14px;color:var(--ds-text-primary)}
        .stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
        .stat-card{background:var(--ds-bg-surface);border-radius:12px;border:1px solid var(--ds-border);padding:16px;text-align:center}
        .stat-val{font-size:1.5rem;font-weight:800;color:var(--ds-text-primary)}
        .stat-label{font-size:.72rem;color:var(--ds-text-tertiary);margin-top:2px}

        .report-item{display:grid;grid-template-columns:auto 1fr auto;gap:14px;padding:16px;border-radius:10px;background:var(--ds-bg-subtle);border:1px solid var(--ds-border);margin-bottom:10px}
        .report-icon{font-size:32px;width:48px;height:48px;border-radius:50%;background:var(--ds-danger-bg);color:var(--ds-danger-fg);display:flex;align-items:center;justify-content:center}
        .report-body{min-width:0}
        .report-header{display:flex;align-items:center;gap:8px;margin-bottom:6px}
        .report-id{font-family:monospace;font-size:.72rem;color:var(--ds-text-tertiary);background:var(--ds-bg-surface);padding:2px 6px;border-radius:4px}
        .report-type{font-size:.7rem;padding:2px 10px;border-radius:10px;font-weight:700}
        .report-type.spam{background:var(--ds-danger-bg);color:var(--ds-danger-fg)}
        .report-type.abuse{background:var(--ds-warning-bg);color:var(--ds-warning-fg)}
        .report-type.copyright{background:var(--ds-accent-soft-bg);color:var(--ds-accent-soft-fg)}
        .report-type.fake{background:var(--ds-accent-soft-bg);color:var(--ds-accent-soft-fg)}
        .report-status{margin-left:auto;font-size:.7rem;padding:2px 10px;border-radius:10px;font-weight:700}
        .report-status.pending{background:var(--ds-warning-bg);color:var(--ds-warning-fg)}
        .report-status.resolved{background:var(--ds-success-bg);color:var(--ds-success-fg)}
        .report-status.escalated{background:var(--ds-danger-bg);color:var(--ds-danger-fg)}
        .report-target{font-weight:700;font-size:.86rem;margin-bottom:4px;color:var(--ds-text-primary)}
        .report-reason{font-size:.82rem;color:var(--ds-text-secondary);margin-bottom:6px;line-height:1.5}
        .report-meta{font-size:.7rem;color:var(--ds-text-tertiary)}
        .report-actions{display:flex;flex-direction:column;gap:6px}
        .btn{padding:6px 12px;border-radius:6px;border:none;font-size:.74rem;cursor:pointer;font-weight:600;white-space:nowrap}
        .btn.approve{background:var(--ds-success-500);color:#fff}
        .btn.reject{background:var(--ds-danger-600);color:#fff}
        .btn.escalate{background:var(--ds-warning-500);color:#fff}
        .btn.secondary{background:var(--ds-bg-subtle);color:var(--ds-text-secondary)}

        .ban-history{margin-top:8px;padding-top:8px;border-top:1px dashed var(--ds-border);font-size:.7rem;color:var(--ds-danger-fg)}
    </style>
</head>
<body class="ds-root" data-shell-active="reports">
    <main class="d-screen">
        <div class="d-page-head">
            <div>
                <div class="ds-eyebrow">DIVOOST SNS · ADMIN</div>
                <h1 class="ds-h1">신고·제재</h1>
                <p class="ds-body">접수된 신고와 제재 이력을 관리합니다.</p>
            </div>
        </div>

        <div class="stat-row">
            <div class="stat-card"><div class="stat-val" id="sPending" style="color:var(--ds-warning-500)">0</div><div class="stat-label">대기중</div></div>
            <div class="stat-card"><div class="stat-val" id="sResolved" style="color:var(--ds-success-500)">0</div><div class="stat-label">해결됨</div></div>
            <div class="stat-card"><div class="stat-val" id="sEscalated" style="color:var(--ds-danger-600)">0</div><div class="stat-label">긴급</div></div>
            <div class="stat-card"><div class="stat-val" id="sBanned" style="color:var(--ds-accent)">0</div><div class="stat-label">제재된 계정</div></div>
        </div>

        <div class="card">
            <h2 class="d-sect-t">📨 접수된 신고</h2>
            <div id="reportsList">
                <div style="padding:40px;text-align:center;color:var(--ds-text-tertiary)">로딩 중...</div>
            </div>
        </div>

        <div class="card">
            <h2 class="d-sect-t">⛔ 제재 이력 (지난 30일)</h2>
            <div class="dev-needed-badge" style="background:var(--ds-warning-bg);border:1px solid var(--ds-warning-500);color:var(--ds-warning-fg);padding:10px 14px;border-radius:8px;margin-bottom:12px;font-size:13px;font-weight:600;">
                ⚠️ 개발 필요: 제재 통계 집계 미구현 (필요한 작업: profiles 테이블에 suspended_at/banned_until 컬럼 추가 + 집계 쿼리 구현)
            </div>
            <p style="font-size:.84rem;color:var(--ds-text-tertiary)">데이터 없음</p>
        </div>
    </main>
    <script src="../js/secure-storage.js"></script>
    <script src="../js/auth-guard.js"></script>
    <script src="../js/supabase-admin.js"></script>
    <script>
        function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; }); }

        async function loadReports(){
            try {
                var reports = await SNSAdmin.listReports();
                var list = document.getElementById('reportsList');
                if(!reports || reports.length === 0){
                    list.innerHTML = '<div style="padding:40px;text-align:center;color:var(--ds-text-tertiary)">접수된 신고가 없습니다.</div>';
                    document.getElementById('sPending').textContent = '0';
                    document.getElementById('sResolved').textContent = '0';
                    document.getElementById('sEscalated').textContent = '0';
                    document.getElementById('sBanned').textContent = '0';
                    return;
                }
                var typeNames = {spam:'스팸', abuse:'욕설/비방', copyright:'저작권', fake:'사칭'};
                var statusNames = {pending:'검토중', resolved:'해결됨', escalated:'긴급'};
                list.innerHTML = reports.map(function(r){
                    return '<div class="report-item">' +
                        '<div class="report-icon">🚨</div>' +
                        '<div class="report-body">' +
                            '<div class="report-header">' +
                                '<span class="report-id">#' + escapeHtml(r.id || '') + '</span>' +
                                '<span class="report-type ' + escapeHtml(r.type||'spam') + '">' + escapeHtml(typeNames[r.type]||r.type||'기타') + '</span>' +
                                '<span class="report-status ' + escapeHtml(r.status||'pending') + '">' + escapeHtml(statusNames[r.status]||r.status||'검토중') + '</span>' +
                            '</div>' +
                            '<div class="report-target">대상: ' + escapeHtml(r.target || '-') + '</div>' +
                            '<div class="report-reason">' + escapeHtml(r.reason || '') + '</div>' +
                            '<div class="report-meta">신고자: ' + escapeHtml(r.reporter_email || '익명') + ' · ' + escapeHtml((r.created_at||'').slice(0,16)) + '</div>' +
                        '</div>' +
                    '</div>';
                }).join('');
                document.getElementById('sPending').textContent = reports.filter(function(r){ return r.status === 'pending'; }).length;
                document.getElementById('sResolved').textContent = reports.filter(function(r){ return r.status === 'resolved'; }).length;
                document.getElementById('sEscalated').textContent = reports.filter(function(r){ return r.status === 'escalated'; }).length;
                document.getElementById('sBanned').textContent = '0';
            } catch(err){
                console.error('신고 로딩 실패:', err);
                document.getElementById('reportsList').innerHTML = '<div class="dev-needed-badge" style="background:var(--ds-warning-bg);border:1px solid var(--ds-warning-500);color:var(--ds-warning-fg);padding:14px;border-radius:8px;font-size:13px;font-weight:600;">⚠️ 개발 필요: reports 테이블 없음 (필요한 작업: Supabase에 reports 테이블 생성 + RLS 정책 + docs/supabase-admin-schema.sql 참고)</div>';
            }
        }

        (async function(){
            var ok = await SNSAdmin.requireAdmin();
            if(!ok) return;
            await loadReports();
        })();
    </script>

    <!-- DDS 공통 셸(상단바/네비/드로어/테마/아이콘) -->
    <script src="../vendor/lucide/lucide.min.js"></script>
    <script src="../js/ds-shell-admin.js"></script>
</body>
</html>
