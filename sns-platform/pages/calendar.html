<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#3b82f6">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="DIVOOST SNS">
    <link rel="manifest" href="../manifest.json">
    <title>콘텐츠 캘린더 | DIVOOST SNS</title>
    <!-- 디자인 시스템(DDS) + 공통 셸 + 자체호스팅 폰트(외부 CDN 미사용). 기존 sns.css 유지. -->
    <link rel="stylesheet" href="../vendor/pretendard/pretendardvariable.css">
    <link rel="stylesheet" href="../css/design-system.css">
    <link rel="stylesheet" href="../css/ds-shell.css">
    <link rel="stylesheet" href="../css/sns.css">
    <style>
        .cal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:12px;flex-wrap:wrap}
        .cal-header h2{font-size:1.1rem;color:var(--ds-text-primary)}
        .cal-nav{display:flex;gap:8px;align-items:center}
        .cal-nav button{padding:7px 13px;border-radius:8px;border:1px solid var(--ds-border);background:var(--ds-bg-surface);color:var(--ds-text-primary);cursor:pointer;font-size:.8rem;font-weight:600}
        .cal-nav button:hover{background:var(--ds-bg-hover);border-color:var(--ds-border-strong)}
        .cal-nav span{font-size:.9rem;font-weight:700;min-width:120px;text-align:center;color:var(--ds-text-primary)}
        .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--ds-border);border-radius:var(--ds-radius-xl);border:1px solid var(--ds-border);overflow:hidden}
        .cal-day-header{padding:9px;text-align:center;font-size:.7rem;font-weight:700;color:var(--ds-text-tertiary);background:var(--ds-bg-subtle)}
        .cal-day{min-height:92px;padding:7px;background:var(--ds-bg-surface);cursor:pointer;transition:.15s;position:relative}
        .cal-day:hover{background:var(--ds-bg-hover)}
        .cal-day.today{background:var(--ds-accent-soft-bg)}
        .cal-day.today .cal-date{color:#fff;background:var(--ds-accent);width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;border-radius:6px}
        .cal-day.other{background:var(--ds-bg-app)}
        .cal-day.other .cal-date{color:var(--ds-text-tertiary);opacity:.5}
        .cal-date{font-size:.72rem;font-weight:700;margin-bottom:5px;color:var(--ds-text-secondary)}
        .cal-post{font-size:.6rem;padding:3px 5px;border-radius:4px;background:var(--ds-accent-soft-bg);color:var(--ds-accent-soft-fg);border-left:2px solid var(--ds-accent);margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
        .cal-post.draft{background:var(--ds-warning-bg);color:var(--ds-warning-fg);border-left-color:var(--ds-warning-500)}
        .cal-post.scheduled{background:var(--ds-accent-soft-bg);color:var(--ds-accent-soft-fg);border-left-color:var(--ds-accent-500)}
        .summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
        .sum-card{background:var(--ds-bg-surface);border-radius:var(--ds-radius-xl);padding:16px;text-align:center;border:1px solid var(--ds-border)}
        .sum-val{font-size:1.5rem;font-weight:800;color:var(--ds-text-primary)}
        .sum-label{font-size:.7rem;color:var(--ds-text-tertiary);margin-top:3px}
        @media(max-width:768px){.cal-day{min-height:56px}.summary{grid-template-columns:1fr 1fr}}
    </style>
</head>
<body class="ds-root" data-shell-active="calendar">
    <main class="d-screen">
        <div class="d-page-head">
            <div>
                <div class="ds-eyebrow">DIVOOST / HUBONTRADE SNS</div>
                <h1 class="ds-h1">콘텐츠 캘린더</h1>
                <p class="ds-body">월별 콘텐츠 일정을 한눈에 관리합니다.</p>
            </div>
            <button class="ds-btn ds-btn-primary" onclick="location.href='create.html'"><i data-lucide="pen-line" class="ds-icon ds-icon-sm"></i> 새 콘텐츠</button>
        </div>
        <div class="summary" id="summary"></div>
        <div class="cal-header">
            <h2 id="calTitle"></h2>
            <div class="cal-nav">
                <button onclick="changeMonth(-1)">◀ 이전</button>
                <span id="calMonth"></span>
                <button onclick="changeMonth(1)">다음 ▶</button>
            </div>
        </div>
        <div class="cal-grid" id="calGrid"></div>
    </main>
    <script>
        var currentDate=new Date();

        function renderCalendar(){
            var year=currentDate.getFullYear(),month=currentDate.getMonth();
            document.getElementById('calMonth').textContent=year+'년 '+(month+1)+'월';
            var posts=JSON.parse(localStorage.getItem('snsPosts')||'[]');
            var schedules=JSON.parse(localStorage.getItem('snsSchedules')||'[]');

            // Summary
            var thisMonth=posts.filter(function(p){return p.date&&p.date.startsWith(year+'-'+String(month+1).padStart(2,'0'))});
            var published=thisMonth.filter(function(p){return p.status==='published'}).length;
            var drafts=thisMonth.filter(function(p){return p.status==='draft'}).length;
            var scheduled=schedules.filter(function(s){return s.date&&s.date.startsWith(year+'-'+String(month+1).padStart(2,'0'))}).length;
            document.getElementById('summary').innerHTML='<div class="sum-card"><div class="sum-val">'+thisMonth.length+'</div><div class="sum-label">이번 달 콘텐츠</div></div><div class="sum-card"><div class="sum-val" style="color:#10b981">'+published+'</div><div class="sum-label">발행됨</div></div><div class="sum-card"><div class="sum-val" style="color:#f59e0b">'+drafts+'</div><div class="sum-label">임시저장</div></div><div class="sum-card"><div class="sum-val" style="color:#8b5cf6">'+scheduled+'</div><div class="sum-label">예약</div></div>';

            // Calendar
            var firstDay=new Date(year,month,1).getDay();
            var daysInMonth=new Date(year,month+1,0).getDate();
            var today=new Date();
            var html='';
            ['일','월','화','수','목','금','토'].forEach(function(d){html+='<div class="cal-day-header">'+d+'</div>'});

            for(var i=0;i<firstDay;i++){
                var prevDay=new Date(year,month,0).getDate()-firstDay+i+1;
                html+='<div class="cal-day other"><div class="cal-date">'+prevDay+'</div></div>';
            }
            for(var d=1;d<=daysInMonth;d++){
                var dateStr=year+'-'+String(month+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
                var isToday=today.getFullYear()===year&&today.getMonth()===month&&today.getDate()===d;
                var dayPosts=posts.filter(function(p){return p.date===dateStr});
                var daySch=schedules.filter(function(s){return s.date===dateStr});
                html+='<div class="cal-day'+(isToday?' today':'')+'"><div class="cal-date">'+d+'</div>';
                dayPosts.forEach(function(p){html+='<div class="cal-post '+(p.status||'')+'">'+p.title.substring(0,10)+'</div>'});
                daySch.forEach(function(s){html+='<div class="cal-post scheduled">⏰ '+s.time+'</div>'});
                html+='</div>';
            }
            var remaining=7-((firstDay+daysInMonth)%7);
            if(remaining<7){for(var r=1;r<=remaining;r++){html+='<div class="cal-day other"><div class="cal-date">'+r+'</div></div>'}}

            document.getElementById('calGrid').innerHTML=html;
        }

        function changeMonth(dir){
            currentDate.setMonth(currentDate.getMonth()+dir);
            renderCalendar();
        }

        renderCalendar();
    </script>
    <script src="../js/secure-storage.js"></script>
    <script src="../js/auth-guard.js"></script>
    <script>
        if("serviceWorker" in navigator){ navigator.serviceWorker.register("/divoost-website/sns-platform/sw.js").catch(function(){}); }
    </script>
    <script src="../js/i18n-auto.js"></script>
    <script src="../js/i18n-common.js"></script>
    <script src="../js/i18n.js"></script>

    <!-- DDS 공통 셸(상단바/네비/드로어/테마/아이콘) -->
    <script src="../vendor/lucide/lucide.min.js"></script>
    <script src="../js/ds-shell.js"></script>
</body>
</html>
