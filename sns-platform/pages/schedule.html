<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="DIVOOST SNS">
    <link rel="manifest" href="../manifest.json">
    <title>예약 발행 | SNS 플랫폼</title>
    <!-- 디자인 시스템(DDS) + 공통 셸 + 자체호스팅 폰트(외부 CDN 미사용). 기존 sns.css 유지. -->
    <link rel="stylesheet" href="../vendor/pretendard/pretendardvariable.css">
    <link rel="stylesheet" href="../css/design-system.css">
    <link rel="stylesheet" href="../css/ds-shell.css">
    <link rel="stylesheet" href="../css/sns.css">
    <style>
        .schedule-form{background:var(--ds-bg-surface);border-radius:12px;border:1px solid var(--ds-border);padding:20px;margin-bottom:16px}
        .schedule-form h2{font-size:1rem;margin-bottom:12px;color:var(--ds-text-primary)}
        .form-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:12px}
        .form-group{display:flex;flex-direction:column;gap:4px}
        .form-group label{font-size:.75rem;font-weight:600;color:var(--ds-text-secondary)}
        .form-group input,.form-group select{padding:8px 12px;border-radius:8px;border:1px solid var(--ds-border);font-size:.82rem;background:var(--ds-bg-surface);color:var(--ds-text-primary);font-family:inherit}
        .scheduled-list{background:var(--ds-bg-surface);border-radius:12px;border:1px solid var(--ds-border);overflow:hidden}
        .sch-item{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--ds-border)}
        .sch-item:last-child{border:none}
        .sch-time{font-size:.8rem;font-weight:700;color:var(--ds-accent);min-width:100px}
        .sch-info{flex:1;min-width:0}
        .sch-title{font-size:.82rem;font-weight:600;color:var(--ds-text-primary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
        .sch-channels{font-size:.7rem;color:var(--ds-text-tertiary);margin-top:2px}
        .sch-actions button{padding:4px 10px;border-radius:4px;border:1px solid var(--ds-border);background:var(--ds-bg-surface);color:var(--ds-text-secondary);font-size:.68rem;cursor:pointer;margin-left:4px}
        .empty{text-align:center;padding:40px;color:var(--ds-text-tertiary)}
        @media(max-width:768px){.form-row{grid-template-columns:1fr}}
    </style>
</head>
<body class="ds-root" data-shell-active="schedule">
    <main class="d-screen">
        <div class="d-page-head">
            <div>
                <div class="ds-eyebrow">DIVOOST / HUBONTRADE SNS</div>
                <h1 class="ds-h1">예약 발행</h1>
                <p class="ds-body">콘텐츠 게시 시각을 예약하고 큐를 관리합니다.</p>
            </div>
        </div>
                <div class="schedule-form">
                    <h2>📅 새 예약 추가</h2>
                    <div class="form-row">
                        <div class="form-group"><label>콘텐츠 선택</label><select id="schPost"><option value="">임시저장된 콘텐츠 선택</option></select></div>
                        <div class="form-group"><label>발행 날짜</label><input type="date" id="schDate"></div>
                        <div class="form-group"><label>발행 시간</label><input type="time" id="schTime" value="09:00"></div>
                    </div>
                    <div class="form-row">
                        <div class="form-group"><label>반복</label><select id="schRepeat"><option value="once">1회만</option><option value="daily">매일</option><option value="weekly">매주</option><option value="monthly">매월</option></select></div>
                        <div class="form-group"><label>최적 시간 추천</label><button onclick="suggestTime()" style="padding:8px 16px;border-radius:8px;border:none;background:#8b5cf6;color:#fff;font-size:.78rem;font-weight:600;cursor:pointer;margin-top:auto">🤖 AI 추천</button></div>
                        <div class="form-group"><label>&nbsp;</label><button onclick="addSchedule()" style="padding:8px 16px;border-radius:8px;border:none;background:var(--ds-accent);color:#fff;font-size:.78rem;font-weight:600;cursor:pointer;margin-top:auto">➕ 예약 추가</button></div>
                    </div>
                </div>
                <div class="d-sect-t">📋 예약된 콘텐츠</div>
                <div class="scheduled-list" id="scheduleList"><div class="empty">예약된 콘텐츠가 없습니다</div></div>
    </main>
    <script>
        // 예약 발행: scheduled_posts 테이블(Supabase REST, RLS 본인 것만) 연동.
        // 실제 자동 발행은 publish-scheduled Edge Function(크론)이 수행.
        var SUPABASE_URL='https://unruyezigyybnuvgdgdt.supabase.co';
        var SUPABASE_KEY='sb_publishable_CTq6ypxtybUPWUcYptiQ0A_mOa0b2hs';
        var SERVER_CHANNELS={facebook:1, instagram:1}; // 서버 예약 발행 지원 채널

        function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c];}); }

        function authToken(){
            try{ var s=JSON.parse(localStorage.getItem('snsAuthSession')||'null'); return s?s.access_token:null; }
            catch(e){ return null; }
        }
        function restHeaders(extra){
            var t=authToken();
            var h={'apikey':SUPABASE_KEY,'Authorization':'Bearer '+(t||SUPABASE_KEY),'Content-Type':'application/json'};
            if(extra){ for(var k in extra) h[k]=extra[k]; }
            return h;
        }

        var today=new Date().toISOString().slice(0,10);
        document.getElementById('schDate').value=today;

        function loadDrafts(){
            var posts=JSON.parse(localStorage.getItem('snsPosts')||'[]');
            var sel=document.getElementById('schPost');
            posts.forEach(function(p){
                var opt=document.createElement('option');
                opt.value=p.id;opt.textContent=p.title+' ('+p.status+')';
                sel.appendChild(opt);
            });
        }

        function suggestTime(){
            // AI 시간 추천 백엔드는 별도 작업(사용자 과거 발행 데이터 분석). 현재는 통념 기반 시간대 제시.
            var times=['09:00','12:30','18:00','20:30','22:00'];
            var best=times[Math.floor(Math.random()*times.length)];
            document.getElementById('schTime').value=best;
            alert('추천 시간: '+best+'\n(데이터 기반 개인화 추천은 추후 제공)');
        }

        function addSchedule(){
            var postId=document.getElementById('schPost').value;
            var date=document.getElementById('schDate').value;
            var time=document.getElementById('schTime').value||'09:00';
            var repeat=document.getElementById('schRepeat').value;
            if(!date){alert('날짜를 선택하세요');return}
            if(!authToken()){alert('로그인이 필요합니다');return}

            var posts=JSON.parse(localStorage.getItem('snsPosts')||'[]');
            var post=posts.find(function(p){return p.id===postId});
            var channels=post&&post.channels?post.channels:['facebook'];
            var content=post?(post.content||''):'';
            var media=(post&&post.image)?[{type:'image',url:post.image}]:[];

            // 지원 채널 안내
            var unsupported=channels.filter(function(c){return !SERVER_CHANNELS[c];});
            if(unsupported.length){
                if(!confirm('예약 자동발행은 Facebook·Instagram만 지원합니다.\n미지원 채널('+unsupported.join(', ')+')은 예약 시각에 실패로 기록됩니다.\n계속할까요?')) return;
            }
            if(repeat!=='once'){
                alert('반복 예약은 준비 중입니다. 이번 예약은 1회로 등록됩니다.');
            }

            // 로컬 날짜+시간 → UTC ISO
            var scheduledAt=new Date(date+'T'+time+':00');
            if(isNaN(scheduledAt.getTime())){alert('날짜/시간 형식 오류');return}
            if(scheduledAt.getTime()<Date.now()){ if(!confirm('예약 시각이 과거입니다. 그래도 등록할까요? (즉시 발행 시도됨)')) return; }

            var row={
                channels:channels,
                content:content,
                media:media,
                scheduled_at:scheduledAt.toISOString(),
                status:'pending'
            };

            fetch(SUPABASE_URL+'/rest/v1/scheduled_posts',{
                method:'POST',
                headers:restHeaders({'Prefer':'return=minimal'}),
                body:JSON.stringify(row)
            }).then(function(r){
                if(!r.ok){ return r.text().then(function(t){ throw new Error('HTTP '+r.status+' '+t.slice(0,200)); }); }
                alert('✅ 예약 추가: '+date+' '+time);
                renderSchedules();
            }).catch(function(err){
                alert('예약 저장 실패: '+err.message);
                console.error('addSchedule 실패', err);
            });
        }

        function renderSchedules(){
            var listEl=document.getElementById('scheduleList');
            if(!authToken()){ listEl.innerHTML='<div class="empty">로그인 후 예약 목록을 볼 수 있습니다</div>'; return; }

            fetch(SUPABASE_URL+'/rest/v1/scheduled_posts?select=*&order=scheduled_at.asc',{
                headers:restHeaders()
            }).then(function(r){
                if(!r.ok){ return r.text().then(function(t){ throw new Error('HTTP '+r.status+' '+t.slice(0,200)); }); }
                return r.json();
            }).then(function(rows){
                if(!rows||rows.length===0){ listEl.innerHTML='<div class="empty">예약된 콘텐츠가 없습니다</div>'; return; }
                var channelNames={'facebook':'📘 FB','tiktok':'🎵 TT','instagram':'📸 IG','naver_blog':'📗 블로그','naver_cafe':'☕ 카페','xiaohongshu':'📕 샤오홍수','douyin':'🎬 도우인'};
                var statusBadge={pending:'⏳ 대기',processing:'🔄 발행 중',published:'✅ 발행됨',failed:'❌ 실패',canceled:'🚫 취소'};
                listEl.innerHTML=rows.map(function(s){
                    var dt=new Date(s.scheduled_at);
                    var d=dt.toLocaleDateString('ko-KR');
                    var t=dt.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});
                    var channels=(s.channels||[]).map(function(c){return channelNames[c]||c}).join(' ');
                    var title=(s.content||'').slice(0,40)||'(내용 없음)';
                    var badge=statusBadge[s.status]||s.status;
                    var err=s.last_error?'<div class="sch-channels" style="color:var(--ds-danger-500)">'+escapeHtml(s.last_error.slice(0,120))+'</div>':'';
                    var cancelBtn=(s.status==='pending')?'<button onclick="cancelSchedule(\''+s.id+'\')">❌ 취소</button>':'';
                    return '<div class="sch-item"><div class="sch-time">'+d+'<br>'+t+'</div><div class="sch-info"><div class="sch-title">'+escapeHtml(title)+'</div><div class="sch-channels">'+channels+' · '+badge+'</div>'+err+'</div><div class="sch-actions">'+cancelBtn+'</div></div>';
                }).join('');
            }).catch(function(err){
                listEl.innerHTML='<div class="empty">목록 조회 실패: '+escapeHtml(err.message)+'</div>';
                console.error('renderSchedules 실패', err);
            });
        }

        function cancelSchedule(id){
            if(!confirm('예약을 취소하시겠습니까?'))return;
            fetch(SUPABASE_URL+'/rest/v1/scheduled_posts?id=eq.'+encodeURIComponent(id),{
                method:'DELETE',
                headers:restHeaders({'Prefer':'return=minimal'})
            }).then(function(r){
                if(!r.ok){ return r.text().then(function(t){ throw new Error('HTTP '+r.status+' '+t.slice(0,200)); }); }
                renderSchedules();
            }).catch(function(err){
                alert('취소 실패: '+err.message);
                console.error('cancelSchedule 실패', err);
            });
        }

        loadDrafts();
        renderSchedules();
    </script>
    <script src="../js/secure-storage.js"></script>
    <script src="../js/auth-guard.js"></script>
    <script>
        if("serviceWorker" in navigator){ navigator.serviceWorker.register("/divoost-website/sns-platform/sw.js").catch(function(){}); }
    </script>
    <script src="../js/i18n-auto.js"></script>
    <script src="../js/i18n-common.js"></script>
    <script src="../js/i18n.js"></script>

    <!-- DDS 공통 셸(상단바/네비/드로어/테마/아이콘) -->
    <script src="../vendor/lucide/lucide.min.js"></script>
    <script src="../js/ds-shell.js"></script>
</body>
</html>
