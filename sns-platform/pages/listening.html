<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="DIVOOST SNS">
    <link rel="manifest" href="../manifest.json">
    <title>소셜 리스닝 | SNS 플랫폼</title>
    <!-- 디자인 시스템(DDS) + 공통 셸 + 자체호스팅 폰트(외부 CDN 미사용). 기존 sns.css 유지. -->
    <link rel="stylesheet" href="../vendor/pretendard/pretendardvariable.css">
    <link rel="stylesheet" href="../css/design-system.css">
    <link rel="stylesheet" href="../css/ds-shell.css">
    <link rel="stylesheet" href="../css/sns.css">
    <style>
        .listen-box{background:linear-gradient(135deg,var(--ds-bg-subtle),var(--ds-bg-app));border:1px solid var(--ds-border);border-radius:14px;padding:24px;margin-bottom:20px;text-align:center}
        .listen-box p{font-size:.82rem;color:var(--ds-text-tertiary);margin-bottom:16px}
        .listen-input-wrap{display:flex;gap:8px;max-width:500px;margin:0 auto}
        .listen-input{flex:1;padding:12px 16px;border-radius:10px;border:2px solid var(--ds-border);background:var(--ds-bg-surface);color:var(--ds-text-primary);font-size:.9rem}
        .listen-btn{padding:12px 20px;border-radius:10px;border:none;background:var(--ds-accent);color:var(--ds-text-on-accent);font-weight:700;cursor:pointer}
        .mention-card{background:var(--ds-bg-surface);border-radius:10px;border:1px solid var(--ds-border);padding:14px;margin-bottom:10px}
        .mention-header{display:flex;align-items:center;gap:8px;margin-bottom:8px}
        .mention-source{font-size:.7rem;padding:2px 8px;border-radius:4px;font-weight:600}
        .mention-date{font-size:.7rem;color:var(--ds-text-tertiary);margin-left:auto}
        .mention-text{font-size:.82rem;line-height:1.6;color:var(--ds-text-secondary)}
        .mention-sentiment{display:inline-block;padding:2px 8px;border-radius:4px;font-size:.68rem;font-weight:600;margin-top:6px}
        .sent-positive{background:var(--ds-success-bg);color:var(--ds-success-fg)}
        .sent-negative{background:var(--ds-danger-bg);color:var(--ds-danger-fg)}
        .sent-neutral{background:var(--ds-bg-subtle);color:var(--ds-text-secondary)}
        .kw-tags{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
        .kw-tag{padding:4px 12px;border-radius:16px;background:var(--ds-bg-subtle);color:var(--ds-text-secondary);font-size:.72rem;cursor:pointer;border:1px solid var(--ds-border)}
        .kw-tag:hover{border-color:var(--ds-accent);color:var(--ds-accent)}
        .stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}
        .stat-box{background:var(--ds-bg-surface);border-radius:10px;padding:14px;text-align:center;border:1px solid var(--ds-border)}
        .stat-box .val{font-size:1.3rem;font-weight:800;color:var(--ds-text-primary)}
        .stat-box .lbl{font-size:.7rem;color:var(--ds-text-tertiary);margin-top:2px}
        @media(max-width:768px){.stats-row{grid-template-columns:1fr 1fr}.listen-input-wrap{flex-direction:column}}
    </style>
</head>
<body class="ds-root" data-shell-active="listening">
    <main class="d-screen">
        <div class="d-page-head">
            <div>
                <div class="ds-eyebrow">DIVOOST / HUBONTRADE SNS</div>
                <h1 class="ds-h1">트렌드·리스닝</h1>
                <p class="ds-body">키워드별 멘션과 트렌드를 모니터링합니다.</p>
            </div>
        </div>
        <div class="dev-needed-badge" style="background:var(--ds-warning-bg);border:1px solid var(--ds-warning-500);color:var(--ds-warning-fg);padding:10px 14px;border-radius:8px;margin-bottom:12px;font-size:13px;font-weight:600;">
            ⚠️ 개발 필요: ScraperAPI 키가 클라이언트에 하드코딩되어 있어 노출 위험이 있습니다.<br>
            필요 작업: Supabase Edge Function (social-listening) 으로 이동 + SCRAPER_API_KEY 환경변수로 분리 + Rate limit + 사용량 카운팅
        </div>
        <div class="listen-box">
            <p>브랜드명 또는 키워드를 입력하면 SNS에서의 언급을 모니터링합니다</p>
            <div class="listen-input-wrap">
                <input type="text" class="listen-input" id="listenInput" placeholder="모니터링할 키워드 (예: DIVOOST)" onkeydown="if(event.key==='Enter')startListening()">
                <button class="listen-btn" onclick="startListening()">👂 모니터링</button>
            </div>
            <div class="kw-tags" id="savedKeywords"></div>
        </div>
        <div id="listenStats" style="display:none">
            <div class="stats-row">
                <div class="stat-box"><div class="val" id="totalMentions">0</div><div class="lbl">총 언급</div></div>
                <div class="stat-box"><div class="val" style="color:var(--ds-success-fg)" id="positivePct">0%</div><div class="lbl">긍정</div></div>
                <div class="stat-box"><div class="val" style="color:var(--ds-danger-fg)" id="negativePct">0%</div><div class="lbl">부정</div></div>
                <div class="stat-box"><div class="val" style="color:var(--ds-text-secondary)" id="neutralPct">0%</div><div class="lbl">중립</div></div>
            </div>
        </div>
        <div id="mentionsList"></div>
    </main>
    <script>
        var SCRAPER_KEY=''/* 🔴 ScraperAPI 키 노출 사고로 제거됨. 키 회전 후 Edge Function에서 사용 */;

        function loadSavedKeywords(){
            var kws=JSON.parse(localStorage.getItem('listenKeywords')||'[]');
            document.getElementById('savedKeywords').innerHTML=kws.map(function(k){return '<span class="kw-tag" onclick="document.getElementById(\'listenInput\').value=\''+k+'\';startListening()">'+k+'</span>'}).join('');
        }

        async function startListening(){
            var kw=document.getElementById('listenInput').value.trim();
            if(!kw)return;
            var kws=JSON.parse(localStorage.getItem('listenKeywords')||'[]');
            if(kws.indexOf(kw)===-1){kws.unshift(kw);if(kws.length>10)kws=kws.slice(0,10);localStorage.setItem('listenKeywords',JSON.stringify(kws));loadSavedKeywords()}

            document.getElementById('mentionsList').innerHTML='<div style="text-align:center;padding:30px;color:var(--ds-text-tertiary)">👂 "'+kw+'" 모니터링 중...</div>';

            try{
                var url='https://api.scraperapi.com/structured/google/search?api_key='+SCRAPER_KEY+'&query='+encodeURIComponent(kw+' site:instagram.com OR site:facebook.com OR site:tiktok.com OR site:blog.naver.com')+'&country=kr&num=20';
                var r=await fetch(url);var data=await r.json();
                var results=data.organic_results||[];

                var mentions=results.map(function(r){
                    var source='웹';
                    if(r.link&&r.link.indexOf('instagram')>-1)source='Instagram';
                    else if(r.link&&r.link.indexOf('facebook')>-1)source='Facebook';
                    else if(r.link&&r.link.indexOf('tiktok')>-1)source='TikTok';
                    else if(r.link&&r.link.indexOf('blog.naver')>-1)source='네이버 블로그';
                    else if(r.link&&r.link.indexOf('cafe.naver')>-1)source='네이버 카페';

                    var text=(r.snippet||r.title||'').toLowerCase();
                    var sentiment='neutral';
                    var posWords=['좋아','추천','최고','대박','만족','편리','훌륭','love','great','best','amazing'];
                    var negWords=['별로','나쁘','실망','불만','worst','bad','poor','terrible'];
                    if(posWords.some(function(w){return text.indexOf(w)>-1}))sentiment='positive';
                    if(negWords.some(function(w){return text.indexOf(w)>-1}))sentiment='negative';

                    return{title:r.title||'',snippet:r.snippet||'',link:r.link||'',source:source,sentiment:sentiment,date:r.date||''};
                });

                var positive=mentions.filter(function(m){return m.sentiment==='positive'}).length;
                var negative=mentions.filter(function(m){return m.sentiment==='negative'}).length;
                var neutral=mentions.length-positive-negative;

                document.getElementById('listenStats').style.display='block';
                document.getElementById('totalMentions').textContent=mentions.length;
                document.getElementById('positivePct').textContent=mentions.length>0?Math.round(positive/mentions.length*100)+'%':'0%';
                document.getElementById('negativePct').textContent=mentions.length>0?Math.round(negative/mentions.length*100)+'%':'0%';
                document.getElementById('neutralPct').textContent=mentions.length>0?Math.round(neutral/mentions.length*100)+'%':'0%';

                var sourceColors={'Instagram':'#E4405F','Facebook':'#1877F2','TikTok':'#000','네이버 블로그':'#03C75A','네이버 카페':'#03C75A','웹':'#64748b'};
                var sentLabels={'positive':'긍정','negative':'부정','neutral':'중립'};
                var sentClasses={'positive':'sent-positive','negative':'sent-negative','neutral':'sent-neutral'};

                document.getElementById('mentionsList').innerHTML=mentions.map(function(m){
                    return '<div class="mention-card" onclick="window.open(\''+m.link.replace(/'/g,'%27')+'\')"><div class="mention-header"><span class="mention-source" style="background:'+(sourceColors[m.source]||'#64748b')+'22;color:'+(sourceColors[m.source]||'#64748b')+'">'+m.source+'</span><span class="mention-sentiment '+sentClasses[m.sentiment]+'">'+sentLabels[m.sentiment]+'</span><span class="mention-date">'+m.date+'</span></div><div style="font-size:.85rem;font-weight:600;margin-bottom:4px">'+m.title+'</div><div class="mention-text">'+m.snippet+'</div></div>';
                }).join('')||'<div style="text-align:center;color:var(--ds-text-tertiary);padding:20px">언급을 찾을 수 없습니다</div>';

            }catch(e){
                document.getElementById('mentionsList').innerHTML='<div style="color:var(--ds-danger-fg);padding:20px">오류: '+e.message+'</div>';
            }
        }

        loadSavedKeywords();
    </script>
    <script src="../js/secure-storage.js"></script>
    <script src="../js/auth-guard.js"></script>
    <script>
        if("serviceWorker" in navigator){ navigator.serviceWorker.register("/divoost-website/sns-platform/sw.js").catch(function(){}); }
    </script>
    <script src="../js/i18n-auto.js"></script>
    <script src="../js/i18n-common.js"></script>
    <script src="../js/i18n.js"></script>

    <!-- DDS 공통 셸(상단바/네비/드로어/테마/아이콘) -->
    <script src="../vendor/lucide/lucide.min.js"></script>
    <script src="../js/ds-shell.js"></script>
</body>
</html>
