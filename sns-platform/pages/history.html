<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="DIVOOST SNS">
    <link rel="manifest" href="../manifest.json">
    <title>발행 이력 | SNS 플랫폼</title>
    <!-- 디자인 시스템(DDS) + 공통 셸 + 자체호스팅 폰트(외부 CDN 미사용). 기존 sns.css 유지. -->
    <link rel="stylesheet" href="../vendor/pretendard/pretendardvariable.css">
    <link rel="stylesheet" href="../css/design-system.css">
    <link rel="stylesheet" href="../css/ds-shell.css">
    <link rel="stylesheet" href="../css/sns.css">
    <style>
        .filter-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
        .filter-bar select,.filter-bar input{padding:8px 12px;border-radius:8px;border:1px solid var(--ds-border);font-size:.82rem;background:var(--ds-bg-surface);color:var(--ds-text-primary)}
        .post-card{background:var(--ds-bg-surface);border-radius:12px;border:1px solid var(--ds-border);padding:16px;margin-bottom:12px;display:flex;gap:14px}
        .post-card:hover{box-shadow:var(--ds-shadow-sm)}
        .pc-img{width:80px;height:80px;border-radius:8px;background:var(--ds-bg-subtle);display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0;overflow:hidden}
        .pc-img img{width:100%;height:100%;object-fit:cover}
        .pc-info{flex:1;min-width:0}
        .pc-title{font-size:.9rem;font-weight:700;margin-bottom:4px;color:var(--ds-text-primary)}
        .pc-content{font-size:.78rem;color:var(--ds-text-secondary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:6px}
        .pc-meta{display:flex;gap:8px;flex-wrap:wrap;font-size:.7rem}
        .pc-tag{padding:2px 8px;border-radius:4px;font-weight:600}
        .pc-tag.published{background:var(--ds-success-bg);color:var(--ds-success-fg)}
        .pc-tag.draft{background:var(--ds-warning-bg);color:var(--ds-warning-fg)}
        .pc-tag.scheduled{background:var(--ds-accent-soft-bg);color:var(--ds-accent-soft-fg)}
        .pc-stats{display:flex;gap:12px;margin-top:8px;font-size:.75rem;color:var(--ds-text-secondary)}
        .pc-actions{display:flex;flex-direction:column;gap:4px;justify-content:center}
        .pc-actions button{padding:4px 10px;border-radius:4px;border:1px solid var(--ds-border);background:var(--ds-bg-surface);color:var(--ds-text-primary);font-size:.68rem;cursor:pointer}
        .pc-actions button:hover{background:var(--ds-bg-subtle)}
        .empty{text-align:center;padding:60px;color:var(--ds-text-tertiary)}
        @media(max-width:768px){.post-card{flex-direction:column}.pc-actions{flex-direction:row}}
    </style>
</head>
<body class="ds-root" data-shell-active="history">
    <main class="d-screen">
        <div class="d-page-head">
            <div>
                <div class="ds-eyebrow">DIVOOST / HUBONTRADE SNS</div>
                <h1 class="ds-h1">발행 이력</h1>
                <p class="ds-body">과거 발행한 콘텐츠와 성과를 확인합니다.</p>
            </div>
            <button class="ds-btn ds-btn-primary" onclick="location.href='create.html'"><i data-lucide="pen-line" class="ds-icon ds-icon-sm"></i> 새 콘텐츠</button>
        </div>
        <div class="filter-bar">
            <select id="fStatus" onchange="render()"><option value="">전체 상태</option><option value="published">발행됨</option><option value="draft">임시저장</option><option value="scheduled">예약</option></select>
            <select id="fChannel" onchange="render()"><option value="">전체 채널</option><option>facebook</option><option>tiktok</option><option>instagram</option><option>naver_blog</option><option>naver_cafe</option><option>xiaohongshu</option><option>douyin</option></select>
            <input type="text" id="fSearch" placeholder="검색..." oninput="render()">
            <span style="margin-left:auto;font-size:.78rem;color:var(--ds-text-secondary)" id="countLabel">0개</span>
        </div>
        <div id="postList"></div>
    </main>
    <script>
        function render(){
            var posts=JSON.parse(localStorage.getItem('snsPosts')||'[]');
            var status=document.getElementById('fStatus').value;
            var channel=document.getElementById('fChannel').value;
            var search=document.getElementById('fSearch').value.toLowerCase();
            if(status)posts=posts.filter(function(p){return p.status===status});
            if(channel)posts=posts.filter(function(p){return p.channels&&p.channels.indexOf(channel)>-1});
            if(search)posts=posts.filter(function(p){return (p.title||'').toLowerCase().indexOf(search)>-1});
            document.getElementById('countLabel').textContent=posts.length+'개';
            if(posts.length===0){document.getElementById('postList').innerHTML='<div class="empty"><div style="font-size:3rem;margin-bottom:12px">📭</div>콘텐츠가 없습니다</div>';return}
            var channelNames={'facebook':'📘 FB','tiktok':'🎵 TT','instagram':'📸 IG','naver_blog':'📗 블로그','naver_cafe':'☕ 카페','xiaohongshu':'📕 샤오홍수','douyin':'🎬 도우인'};
            document.getElementById('postList').innerHTML=posts.map(function(p){
                var channels=(p.channels||[]).map(function(c){return channelNames[c]||c}).join(' ');
                var publishedLinks='';
                if(p.publishedTo && p.publishedTo.length>0){
                    publishedLinks='<div style="margin-top:6px;font-size:.7rem;display:flex;gap:6px;flex-wrap:wrap">';
                    p.publishedTo.forEach(function(pt){
                        var icon = pt.channel==='instagram' ? '📸' : (pt.channel==='facebook' ? '📘' : '🔗');
                        var label = pt.accountName || pt.channel;
                        if(pt.url){
                            publishedLinks+='<a href="'+pt.url+'" target="_blank" style="padding:2px 8px;border-radius:4px;background:var(--ds-accent-soft-bg);color:var(--ds-accent-soft-fg);text-decoration:none;font-weight:600">'+icon+' '+label+' →</a>';
                        } else {
                            publishedLinks+='<span style="padding:2px 8px;border-radius:4px;background:var(--ds-bg-subtle);color:var(--ds-text-secondary)">'+icon+' '+label+'</span>';
                        }
                    });
                    publishedLinks+='</div>';
                }
                return '<div class="post-card"><div class="pc-img">'+(p.image?'<img src="'+p.image+'" onerror="this.outerHTML=\'📝\'">':'📝')+'</div><div class="pc-info"><div class="pc-title">'+p.title+'</div><div class="pc-content">'+(p.content||'').substring(0,80)+'</div><div class="pc-meta"><span class="pc-tag '+(p.status||'draft')+'">'+({'published':'✅ 발행','draft':'📝 임시','scheduled':'⏰ 예약'}[p.status]||p.status)+'</span><span style="color:var(--ds-text-tertiary)">'+channels+'</span><span style="color:var(--ds-text-tertiary)">'+(p.date||'')+'</span></div>'+publishedLinks+'<div class="pc-stats"><span>❤️ '+(p.likes||0)+'</span><span>💬 '+(p.comments||0)+'</span><span>🔄 '+(p.shares||0)+'</span><span>👁 '+(p.views||0)+'</span></div></div><div class="pc-actions"><button onclick="editPost(\''+p.id+'\')">✏️ 수정</button><button onclick="deletePost(\''+p.id+'\')">🗑 삭제</button><button onclick="simulateEngagement(\''+p.id+'\')" title="실제 SNS API 연동 전 테스트용" style="background:var(--ds-warning-bg);color:var(--ds-warning-fg)">📊 시뮬레이션 (개발용)</button></div></div>';
            }).join('');
        }
        function deletePost(id){
            if(!confirm('삭제하시겠습니까?'))return;
            var posts=JSON.parse(localStorage.getItem('snsPosts')||'[]');
            posts=posts.filter(function(p){return p.id!==id});
            localStorage.setItem('snsPosts',JSON.stringify(posts));
            render();
        }
        function simulateEngagement(id){
            if(!confirm('⚠️ 개발 필요: 실제 SNS API에서 인터렉션을 가져오는 기능이 미구현되어 있습니다.\n\n필요 작업: Facebook/Instagram Graph API의 insights endpoint 호출 + posts 테이블 업데이트\n\n그 사이 임시 가짜 값을 추가합니다 (테스트용). 계속하시겠습니까?')) return;
            var posts=JSON.parse(localStorage.getItem('snsPosts')||'[]');
            var idx=posts.findIndex(function(p){return p.id===id});
            if(idx===-1)return;
            posts[idx].likes=(posts[idx].likes||0)+Math.floor(Math.random()*50)+10;
            posts[idx].comments=(posts[idx].comments||0)+Math.floor(Math.random()*15)+2;
            posts[idx].shares=(posts[idx].shares||0)+Math.floor(Math.random()*10)+1;
            posts[idx].views=(posts[idx].views||0)+Math.floor(Math.random()*200)+50;
            localStorage.setItem('snsPosts',JSON.stringify(posts));
            render();
            alert('📊 (테스트용) 가짜 인터렉션 값 추가됨');
        }
        function editPost(id){location.href='create.html?edit='+id}
        render();
    </script>
    <script src="../js/secure-storage.js"></script>
    <script src="../js/auth-guard.js"></script>
    <script>
        if("serviceWorker" in navigator){ navigator.serviceWorker.register("/divoost-website/sns-platform/sw.js").catch(function(){}); }
    </script>
    <script src="../js/i18n-auto.js"></script>
    <script src="../js/i18n-common.js"></script>
    <script src="../js/i18n.js"></script>

    <!-- DDS 공통 셸(상단바/네비/드로어/테마/아이콘) -->
    <script src="../vendor/lucide/lucide.min.js"></script>
    <script src="../js/ds-shell.js"></script>
</body>
</html>
