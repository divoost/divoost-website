<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="DIVOOST SNS">
    <link rel="manifest" href="../manifest.json">
    <title>채널 연결 | DIVOOST SNS</title>
    <!-- 디자인 시스템(DDS) + 공통 셸 + 자체호스팅 폰트(외부 CDN 미사용). 기존 sns.css 유지. -->
    <link rel="stylesheet" href="../vendor/pretendard/pretendardvariable.css">
    <link rel="stylesheet" href="../css/design-system.css">
    <link rel="stylesheet" href="../css/ds-shell.css">
    <link rel="stylesheet" href="../css/sns.css">
    <style>
        /* 화면 전용 스타일 — 전부 --ds-* 토큰 사용(하드코딩 색상 금지) */
        .cnx-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--ds-space-3);margin-bottom:var(--ds-space-6)}
        .cnx-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:var(--ds-space-4)}
        .cnx-card-pad{padding:var(--ds-space-5)}
        .cnx-top{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--ds-space-3);margin-bottom:var(--ds-space-3)}
        .cnx-name{font-size:var(--ds-text-lg);font-weight:var(--ds-weight-bold);color:var(--ds-text-primary);line-height:var(--ds-leading-snug);display:flex;align-items:center;gap:8px}
        .cnx-desc{font-size:var(--ds-text-sm);color:var(--ds-text-secondary);line-height:var(--ds-leading-relaxed);margin-bottom:var(--ds-space-4)}
        .cnx-caps{display:flex;flex-direction:column;gap:6px;padding-top:var(--ds-space-3);border-top:1px solid var(--ds-border-subtle)}
        .cnx-cap{display:flex;align-items:center;justify-content:space-between;font-size:var(--ds-text-xs);color:var(--ds-text-secondary)}
        .cnx-cap-label{display:flex;align-items:center;gap:6px}
        .cnx-cap-label .ds-icon{color:var(--ds-text-tertiary)}
        .cnx-cap-val{font-weight:var(--ds-weight-semibold);color:var(--ds-text-primary)}
        .cnx-actions{margin-top:var(--ds-space-4)}
        .cnx-check{margin-top:var(--ds-space-3);padding:var(--ds-space-3) var(--ds-space-4);background:var(--ds-bg-subtle);border:1px solid var(--ds-border-subtle);border-radius:var(--ds-radius-lg)}
        .cnx-check[hidden]{display:none}
        .cnx-check ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
        .cnx-check li{display:flex;align-items:flex-start;gap:7px;font-size:var(--ds-text-xs);color:var(--ds-text-secondary);line-height:var(--ds-leading-snug)}
        .cnx-check li .ds-icon{color:var(--ds-text-tertiary);flex:none;margin-top:1px}
        @media(max-width:768px){
            .cnx-stats{grid-template-columns:1fr 1fr}
            .cnx-grid{grid-template-columns:1fr}
        }
    </style>
</head>
<body class="ds-root" data-shell-active="connections">
    <main class="d-screen">
        <div class="d-page-head">
            <div>
                <div class="ds-eyebrow">DIVOOST / HUBONTRADE SNS</div>
                <h1 class="ds-h1">채널 연결</h1>
                <p class="ds-body">9개 채널의 연동 상태와 정책을 확인합니다.</p>
            </div>
        </div>

        <div class="d-note warn">
            <i data-lucide="shield-alert" class="ds-icon ds-icon-sm"></i>
            <div><b>보안:</b> 채널 토큰·비밀키는 서버 전용으로 저장되며 브라우저/코드에 노출하지 않습니다. 이 화면은 연동 상태 표시용 데모이며, 실제 OAuth·앱 심사·토큰 저장은 백엔드에서 처리됩니다. UI에 연동 위저드가 있다고 자동 게시가 보장되는 것은 아닙니다.</div>
        </div>

        <!-- 상태 요약 -->
        <div class="cnx-stats" id="cnxStats"></div>

        <!-- 채널 상태 카드 그리드 -->
        <div class="cnx-grid" id="cnxGrid"></div>
    </main>

    <script>
        // 정적 데모 데이터(외부 입력 아님). 비밀키·토큰 문자열 절대 미포함. ES5 호환.
        var CHANNELS = [
            { name: 'Facebook Page',          icon: 'facebook',        status: 'needs_review', desc: 'Graph API 버전·앱 심사 확인 필요',            auto: '조건부',   receive: '조건부' },
            { name: 'Instagram Professional', icon: 'instagram',       status: 'needs_review', desc: '프로 계정·게시/메시지 권한·앱 심사',          auto: '조건부',   receive: '조건부' },
            { name: 'TikTok 글로벌',          icon: 'music',           status: 'blocked',      desc: 'CLIENT_KEY·Direct Post 심사 필요',            auto: '심사 후',  receive: '제한적' },
            { name: 'YouTube Shorts',         icon: 'youtube',         status: 'needs_review', desc: 'OAuth·쿼터·정책 최신 확인',                   auto: '조건부',   receive: '일부' },
            { name: 'Zalo OA',                icon: 'message-circle',  status: 'blocked',      desc: 'Official Account 인증 필요',                  auto: '채널별',   receive: '조건부' },
            { name: 'Naver Blog',             icon: 'pen-line',        status: 'manual',       desc: '공식 글쓰기 API 종료 · 수동 발행',            auto: '미지원',   receive: '수동' },
            { name: 'Naver Cafe',             icon: 'users',           status: 'manual',       desc: '공식 글쓰기 연동 여부 미확인',                auto: '미확인',   receive: '미확인' },
            { name: '샤오홍수(小红书)',       icon: 'book-open',       status: 'manual',       desc: '공개 자동 발행 미확인 · 수동 안내',           auto: '미확인',   receive: '미확인' },
            { name: '도우인(抖音)',           icon: 'clapperboard',    status: 'blocked',      desc: '공식 API 앱 승인·중국 규정 검증',             auto: '심사 후',  receive: '조건부' }
        ];

        // 상태 메타(배지 규칙). 매직문자열 상수화.
        var STATUS_META = {
            connected:    { label: '연동됨',    badge: 'ds-badge-success', dot: true },
            needs_review: { label: '심사 필요',  badge: 'ds-badge-warning', dot: true },
            manual:       { label: '수동',      badge: 'ds-badge',         dot: false },
            blocked:      { label: '차단',      badge: 'ds-badge-danger',  dot: true }
        };

        // 상태별 연동 체크리스트(데모용 안내). 상태 키 기준.
        var CHECKLIST = {
            connected:    ['OAuth 연결 완료', '채널 권한 확인', '토큰 서버 저장(암호화)', '게시 테스트 통과'],
            needs_review: ['앱 심사/검수 신청', '필요 권한 스코프 승인 대기', '토큰은 서버 환경변수에만 저장', '심사 완료 후 게시 활성화'],
            manual:       ['공식 자동 발행 API 미지원/미확인', '운영자 수동 발행 절차 안내', '발행 이력은 수동 기록', '정책 변경 시 재검토'],
            blocked:      ['공식 앱/계정 인증 필요', '지역 규정·심사 요건 검증', '승인 전 자동 게시 비활성', '승인 후 단계적 연동']
        };

        // XSS 방지 — 정적 데이터지만 규칙에 따라 모든 출력 이스케이프.
        function escapeHtml(s) {
            if (s === null || typeof s === 'undefined') return '';
            return String(s)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        // 상태별 개수 집계(빈 배열/미지정 상태 방어).
        function countByStatus(status) {
            if (!Array.isArray(CHANNELS)) return 0;
            return CHANNELS.filter(function (c) { return c.status === status; }).length;
        }

        function renderStats() {
            var stats = [
                { label: '연동됨',    icon: 'plug-zap',     value: countByStatus('connected') },
                { label: '심사 필요', icon: 'clock',        value: countByStatus('needs_review') },
                { label: '수동',      icon: 'hand',         value: countByStatus('manual') },
                { label: '차단',      icon: 'shield-x',     value: countByStatus('blocked') }
            ];
            var html = '';
            stats.forEach(function (s) {
                html += '<div class="ds-stat">' +
                    '<div class="ds-stat-label"><i data-lucide="' + escapeHtml(s.icon) + '" class="ds-icon ds-icon-sm"></i> ' + escapeHtml(s.label) + '</div>' +
                    '<div class="ds-stat-value">' + escapeHtml(String(s.value)) + '</div>' +
                    '</div>';
            });
            document.getElementById('cnxStats').innerHTML = html;
        }

        function renderChannels() {
            var html = '';
            CHANNELS.forEach(function (c, i) {
                var meta = STATUS_META[c.status] || { label: c.status, badge: 'ds-badge', dot: false };
                var items = CHECKLIST[c.status] || [];
                var listHtml = '';
                items.forEach(function (it) {
                    listHtml += '<li><i data-lucide="check" class="ds-icon ds-icon-sm"></i> ' + escapeHtml(it) + '</li>';
                });

                html += '<div class="ds-card ds-card-hover cnx-card-pad">' +
                    '<div class="cnx-top">' +
                        '<div class="cnx-name"><i data-lucide="' + escapeHtml(c.icon) + '" class="ds-icon ds-icon-sm"></i> ' + escapeHtml(c.name) + '</div>' +
                        '<span class="ds-badge ' + escapeHtml(meta.badge) + (meta.dot ? ' ds-badge-dot' : '') + '">' + escapeHtml(meta.label) + '</span>' +
                    '</div>' +
                    '<div class="cnx-desc">' + escapeHtml(c.desc) + '</div>' +
                    '<div class="cnx-caps">' +
                        '<div class="cnx-cap"><span class="cnx-cap-label"><i data-lucide="send" class="ds-icon ds-icon-sm"></i> 자동 게시</span><span class="cnx-cap-val">' + escapeHtml(c.auto) + '</span></div>' +
                        '<div class="cnx-cap"><span class="cnx-cap-label"><i data-lucide="inbox" class="ds-icon ds-icon-sm"></i> 수신</span><span class="cnx-cap-val">' + escapeHtml(c.receive) + '</span></div>' +
                    '</div>' +
                    '<div class="cnx-actions">' +
                        '<button type="button" class="ds-btn ds-btn-ghost ds-btn-sm" onclick="toggleChecklist(' + i + ')"><i data-lucide="list-checks" class="ds-icon ds-icon-sm"></i> 연동 체크리스트 보기</button>' +
                    '</div>' +
                    '<div class="cnx-check" id="cnxCheck' + i + '" hidden><ul>' + listHtml + '</ul></div>' +
                    '</div>';
            });
            document.getElementById('cnxGrid').innerHTML = html;
        }

        // 체크리스트 토글(데모 — 백엔드 호출 없음).
        function toggleChecklist(i) {
            var el = document.getElementById('cnxCheck' + i);
            if (!el) return;
            el.hidden = !el.hidden;
            if (window.lucide && typeof window.lucide.createIcons === 'function') {
                window.lucide.createIcons();
            }
        }

        renderStats();
        renderChannels();
    </script>

    <script src="../js/secure-storage.js"></script>
    <script src="../js/auth-guard.js"></script>
    <script>
        if ("serviceWorker" in navigator) { navigator.serviceWorker.register("/divoost-website/sns-platform/sw.js").catch(function () {}); }
    </script>

    <!-- DDS 공통 셸(상단바/네비/드로어/테마/아이콘) -->
    <script src="../vendor/lucide/lucide.min.js"></script>
    <script src="../js/ds-shell.js"></script>
</body>
</html>
